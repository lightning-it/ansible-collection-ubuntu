---
# ansible-lint: disable=var-naming
# Collection-level example playbook for lit.ubuntu.

- name: Ubuntu foundational baseline example
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: lit.ubuntu.repos
      vars:
        repos_enabled: true
        repos_update_cache: false

    - role: lit.ubuntu.baseline
      vars:
        baseline_timezone: Etc/UTC
        baseline_packages_present:
          - vim
          - jq
          - tar
          - bash-completion

    - role: lit.ubuntu.automatic_updates
      vars:
        automatic_updates_enabled: false

    # The portable Squid service is deployed by lit.supplementary. This
    # collection-level example exposes the Ubuntu adapter without activating
    # proxy or firewall changes. Enabling the host-firewall egress boundary
    # additionally requires one unique host-local, non-login `proxy` account
    # at exact UID/GID 13; directory-only or duplicate-UID entries are rejected.
    - role: lit.ubuntu.forward_proxy_client
      vars:
        forward_proxy_client_enabled: false

    # Disabled demonstration only: approve the actual helper path and SHA256
    # before opting in. This configures future starts, never an existing daemon.
    - role: lit.ubuntu.podman
      when: false
      vars:
        podman_dns_authoritative_only: false
        podman_dns_resolver_executable: /usr/lib/podman/aardvark-dns
        podman_dns_resolver_sha256: ""

    # Disabled demonstration only. Exact UDP53 clients require read-only bridge
    # gateway evidence and cannot coexist with aggregate container DNS access.
    # Example capability (not enabled):
    #   application_dns:
    #     interface: appbridge
    #     source_ipv4: 10.20.1.2/32
    #     destination_ipv4: 10.20.1.1
    - role: lit.ubuntu.host_firewall
      when: false
      vars:
        host_firewall_container_dns_clients: {}

    - role: lit.ubuntu.users
      vars:
        users_accounts:
          - name: ops-admin
            groups: ["sudo"]
            shell: /bin/bash
