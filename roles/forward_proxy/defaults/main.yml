---
forward_proxy_enabled: false
forward_proxy_manage_package: false
forward_proxy_bootstrap_package_only: false
forward_proxy_manage_service: true
forward_proxy_restart_services: []
forward_proxy_package_name: squid
forward_proxy_service_name: squid
forward_proxy_file_owner: root
forward_proxy_file_group: root
forward_proxy_ss_binary: /usr/bin/ss

forward_proxy_listen_addresses:
  - 127.0.0.1
forward_proxy_port: 3128
forward_proxy_allowed_clients:
  - 127.0.0.1/32
forward_proxy_allowed_destination_domains: []
forward_proxy_allowed_destination_ports:
  - 80
  - 443

# When enabled, Squid remains the client-facing LIT proxy and chains every
# request to this customer/site proxy. Authentication material is deliberately
# outside this role until a secret-backed contract is implemented.
forward_proxy_upstream_enabled: false
forward_proxy_upstream_host: ""
forward_proxy_upstream_port: 3128

forward_proxy_no_proxy:
  - localhost
  - 127.0.0.1
  - ::1
forward_proxy_apt_direct_hosts:
  - localhost
  - 127.0.0.1
forward_proxy_url: "http://127.0.0.1:{{ forward_proxy_port }}"
forward_proxy_container_url: "http://host.containers.internal:{{ forward_proxy_port }}"
forward_proxy_container_enabled: false

# Foreign host-firewall inputs are mapped once into this role-owned interface.
forward_proxy_container_firewall_access: >-
  {{ host_firewall_forward_proxy_access | default({}) }}
forward_proxy_container_firewall_interfaces: >-
  {{ host_firewall_container_interfaces | default([]) }}
forward_proxy_bootstrap_firewall_mode: "{{ host_firewall_mode | default('') }}"
forward_proxy_bootstrap_firewall_egress_policy: >-
  {{ host_firewall_egress_policy | default({}) }}

forward_proxy_config_path: /etc/squid/squid.conf
forward_proxy_apt_config_path: /etc/apt/apt.conf.d/99-lit-forward-proxy
forward_proxy_profile_path: /etc/profile.d/90-lit-forward-proxy.sh
forward_proxy_environment_path: /etc/environment.d/90-lit-forward-proxy.conf
forward_proxy_systemd_environment_path: /etc/systemd/system.conf.d/90-lit-forward-proxy.conf
forward_proxy_containers_config_path: /etc/containers/containers.conf.d/90-lit-forward-proxy.conf
forward_proxy_state_marker_path: /var/lib/lit-forward-proxy/managed
