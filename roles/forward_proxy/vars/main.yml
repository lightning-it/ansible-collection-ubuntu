---
_forward_proxy_base_managed_paths:
  - "{{ forward_proxy_config_path }}"
  - "{{ forward_proxy_pod_manifest_path }}"
  - "{{ forward_proxy_apt_config_path }}"
  - "{{ forward_proxy_profile_path }}"
  - "{{ forward_proxy_environment_path }}"
  - "{{ forward_proxy_systemd_environment_path }}"
_forward_proxy_all_managed_paths: >-
  {{ _forward_proxy_base_managed_paths + [forward_proxy_containers_config_path] }}
_forward_proxy_managed_paths_effective: >-
  {{
    _forward_proxy_all_managed_paths
    if forward_proxy_container_enabled | bool
    else _forward_proxy_base_managed_paths
  }}
_forward_proxy_state_manifest:
  schema: lit.ubuntu.forward_proxy.managed-state/v1
  owner: lit.ubuntu.forward_proxy
  unit_name: "{{ forward_proxy_unit_name }}"
  managed_paths: "{{ _forward_proxy_managed_paths_effective }}"
