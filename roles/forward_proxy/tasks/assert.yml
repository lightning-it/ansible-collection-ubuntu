---
- name: Validate forward proxy interface
  ansible.builtin.assert:
    that:
      - forward_proxy_enabled is boolean
      - forward_proxy_manage_runtime is boolean
      - forward_proxy_restart_services is sequence
      - forward_proxy_restart_services is not string
      - forward_proxy_restart_services | unique | list | length == forward_proxy_restart_services | length
      - forward_proxy_file_owner is match('^(?:[a-z_][a-z0-9_-]{0,31}|[0-9]{1,10})$')
      - forward_proxy_file_group is match('^(?:[a-z_][a-z0-9_-]{0,31}|[0-9]{1,10})$')
      - >-
        forward_proxy_image
        is match('^docker\.io/ubuntu/squid@sha256:[a-f0-9]{64}\Z')
      - forward_proxy_image_pull_policy == 'Never'
      - forward_proxy_runtime_uid == 13
      - forward_proxy_runtime_gid == 13
      - forward_proxy_unit_name is match('^[a-z][a-z0-9-]{2,63}\Z')
      - forward_proxy_systemd_scope == 'system'
      - forward_proxy_podman_binary is match('^/[A-Za-z0-9_./-]+$')
      - forward_proxy_readiness_timeout | int >= 1
      - forward_proxy_readiness_timeout | int <= 300
      - forward_proxy_listen_addresses is sequence
      - forward_proxy_listen_addresses is not string
      - forward_proxy_listen_addresses | length > 0
      - forward_proxy_listen_addresses | unique | list | length == forward_proxy_listen_addresses | length
      - "'127.0.0.1' in forward_proxy_listen_addresses"
      - forward_proxy_port | int >= 1024
      - forward_proxy_port | int <= 65535
      - forward_proxy_allowed_clients is sequence
      - forward_proxy_allowed_clients is not string
      - forward_proxy_allowed_clients | length > 0
      - forward_proxy_allowed_clients | unique | list | length == forward_proxy_allowed_clients | length
      - "'127.0.0.1/32' in forward_proxy_allowed_clients"
      - forward_proxy_allowed_destination_domains is sequence
      - forward_proxy_allowed_destination_domains is not string
      - not forward_proxy_enabled or forward_proxy_allowed_destination_domains | length > 0
      - forward_proxy_allowed_destination_ports is sequence
      - forward_proxy_allowed_destination_ports is not string
      - forward_proxy_allowed_destination_ports | length > 0
      - 443 in forward_proxy_allowed_destination_ports
      - >-
        forward_proxy_allowed_destination_ports | unique | list | length
        == forward_proxy_allowed_destination_ports | length
      - forward_proxy_upstream_enabled is boolean
      - >-
        not forward_proxy_upstream_enabled
        or (
          forward_proxy_upstream_host | length >= 1
          and forward_proxy_upstream_host | length <= 253
          and not forward_proxy_upstream_host.startswith('.')
          and not forward_proxy_upstream_host.endswith('.')
        )
      - forward_proxy_upstream_port | int >= 1
      - forward_proxy_upstream_port | int <= 65535
      - forward_proxy_no_proxy is sequence
      - forward_proxy_no_proxy is not string
      - forward_proxy_apt_direct_hosts is sequence
      - forward_proxy_apt_direct_hosts is not string
      - forward_proxy_apt_direct_hosts | unique | list | length == forward_proxy_apt_direct_hosts | length
      - forward_proxy_apt_direct_hosts | difference(forward_proxy_no_proxy) | length == 0
      - forward_proxy_apt_direct_hosts | difference(['localhost', '127.0.0.1']) | length == 0
      - forward_proxy_url == 'http://127.0.0.1:' ~ (forward_proxy_port | string)
      - >-
        forward_proxy_container_url
        == 'http://host.containers.internal:' ~ (forward_proxy_port | string)
      - forward_proxy_container_enabled is boolean
      - >-
        not forward_proxy_container_enabled
        or forward_proxy_listen_addresses | difference(['127.0.0.1']) | length > 0
      - >-
        forward_proxy_listen_addresses | difference(['127.0.0.1']) | length == 0
        or forward_proxy_container_enabled
    fail_msg: >-
      Forward proxy inputs must define the digest-pinned non-root Squid
      container, explicit clients and destinations, and a closed optional
      upstream. Client-container propagation requires its live bridge boundary.

- name: Validate opted-in service restarts
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_.@-]{1,128}$')
    fail_msg: "Opted-in proxy client services must use exact systemd unit names."
  loop: "{{ forward_proxy_restart_services }}"

- name: Validate upstream hostname labels
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$')
    fail_msg: "The upstream proxy must be an exact DNS name with valid labels."
  loop: "{{ forward_proxy_upstream_host.split('.') }}"
  when: forward_proxy_upstream_enabled | bool

- name: Validate the proxy owner firewall boundary
  ansible.builtin.assert:
    that:
      - forward_proxy_firewall_egress is mapping
      - forward_proxy_firewall_egress.enabled is boolean
      - forward_proxy_firewall_egress.enabled
      - forward_proxy_firewall_egress.owner_username == 'proxy'
    fail_msg: >-
      The host-network Squid container runs as Ubuntu base UID/GID 13 (proxy),
      and the enabled firewall egress contract must bind that exact owner.
  when: forward_proxy_enabled | bool

- name: Require the shared client-container firewall contract
  ansible.builtin.assert:
    that:
      - forward_proxy_container_firewall_access is mapping
      - forward_proxy_container_firewall_interfaces is sequence
      - forward_proxy_container_firewall_interfaces is not string
    fail_msg: >-
      Client-container proxy propagation requires the live, inventory-pinned
      host firewall access contract and container interface list.
  when: forward_proxy_container_enabled | bool

- name: Validate the shared client-container firewall contract
  ansible.builtin.assert:
    that:
      - >-
        forward_proxy_container_firewall_access.keys() | list | sort
        == ['destination_ipv4', 'enabled', 'interfaces', 'port', 'sources_ipv4']
      - forward_proxy_container_firewall_access.enabled is boolean
      - forward_proxy_container_firewall_access.enabled
      - forward_proxy_container_firewall_access.port is integer
      - forward_proxy_container_firewall_access.port == forward_proxy_port
      - forward_proxy_container_firewall_access.destination_ipv4 in forward_proxy_listen_addresses
      - forward_proxy_container_firewall_access.destination_ipv4 != '127.0.0.1'
      - forward_proxy_container_firewall_access.interfaces | length > 0
      - forward_proxy_container_firewall_access.sources_ipv4 | length > 0
      - >-
        forward_proxy_container_firewall_access.interfaces
        | difference(forward_proxy_container_firewall_interfaces) | length == 0
      - >-
        forward_proxy_container_firewall_access.sources_ipv4
        | difference(forward_proxy_allowed_clients) | length == 0
    fail_msg: >-
      Client-container propagation must use the same exact listener, port,
      interfaces, and source CIDRs as the enabled host-firewall access rule.
  when: forward_proxy_container_enabled | bool

- name: Validate forward proxy listen addresses
  ansible.builtin.assert:
    that:
      - >-
        item is match(
          '^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
          '(?:\\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
        )
    fail_msg: "Forward proxy listen addresses must be exact IPv4 addresses."
  loop: "{{ forward_proxy_listen_addresses }}"

- name: Validate forward proxy client networks
  ansible.builtin.assert:
    that:
      - >-
        item is match(
          '^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
          '(?:\\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}'
          '/(?:[1-9]|[12][0-9]|3[0-2])$'
        )
    fail_msg: "Forward proxy clients must be explicit non-global IPv4 CIDRs."
  loop: "{{ forward_proxy_allowed_clients }}"

- name: Validate forward proxy destination domains
  ansible.builtin.assert:
    that:
      - >-
        item is match(
          '^\\.?(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+'
          '[A-Za-z]{2,63}$'
        )
    fail_msg: "Forward proxy destinations must be exact DNS names or dotted domain suffixes."
  loop: "{{ forward_proxy_allowed_destination_domains }}"

- name: Validate forward proxy destination ports
  ansible.builtin.assert:
    that:
      - item is integer
      - item in [80, 443]
    fail_msg: "The standard LIT forward proxy permits only HTTP 80 and HTTPS CONNECT 443."
  loop: "{{ forward_proxy_allowed_destination_ports }}"

- name: Validate forward proxy bypass entries
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9.:_-]+(?:/[0-9]{1,3})?$')
      - "',' not in item"
      - "'\\n' not in item"
      - "'\\r' not in item"
      - "'\"' not in item"
    fail_msg: "NO_PROXY entries must be individual host, domain, address, or CIDR tokens."
  loop: "{{ forward_proxy_no_proxy }}"

- name: Validate exact apt direct hosts
  ansible.builtin.assert:
    that:
      - item in ['localhost', '127.0.0.1']
    fail_msg: >-
      APT DIRECT exceptions are restricted to host-local loopback names and
      addresses; site-local exceptions need their own reviewed firewall grant.
  loop: "{{ forward_proxy_apt_direct_hosts }}"

- name: Validate managed forward proxy paths
  ansible.builtin.assert:
    that:
      - item is match('^/[A-Za-z0-9_./-]+$')
      - item != '/'
      - "'..' not in item.split('/')"
      - "'//' not in item"
    fail_msg: "Managed forward proxy paths must be exact absolute paths."
  loop:
    - "{{ forward_proxy_config_path }}"
    - "{{ forward_proxy_pod_manifest_path }}"
    - "{{ forward_proxy_apt_config_path }}"
    - "{{ forward_proxy_profile_path }}"
    - "{{ forward_proxy_environment_path }}"
    - "{{ forward_proxy_systemd_environment_path }}"
    - "{{ forward_proxy_containers_config_path }}"
    - "{{ forward_proxy_state_marker_path }}"
    - "{{ forward_proxy_quadlet_dir }}"
    - "{{ forward_proxy_podman_binary }}"
