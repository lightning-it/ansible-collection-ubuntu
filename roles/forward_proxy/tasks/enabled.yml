---
- name: Verify the pinned Squid image was preloaded
  ansible.builtin.command:
    argv:
      - "{{ forward_proxy_podman_binary }}"
      - image
      - exists
      - "{{ forward_proxy_image }}"
  changed_when: false
  when: forward_proxy_manage_runtime | bool

- name: Create forward proxy managed directories
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0755"
  loop: "{{ (_forward_proxy_all_managed_paths + [forward_proxy_state_marker_path]) | unique | list }}"

- name: Record that the role owns the managed forward proxy state
  ansible.builtin.copy:
    content: "{{ _forward_proxy_state_manifest | to_nice_json }}\n"
    dest: "{{ forward_proxy_state_marker_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0600"

- name: Render the Squid policy for the non-root container
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ forward_proxy_config_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"
  register: forward_proxy_squid_config_result

- name: Render the digest-pinned Squid Pod manifest
  ansible.builtin.template:
    src: squid-pod.yml.j2
    dest: "{{ forward_proxy_pod_manifest_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0640"
  register: forward_proxy_pod_manifest_result

- name: Render apt proxy policy
  ansible.builtin.template:
    src: apt-proxy.conf.j2
    dest: "{{ forward_proxy_apt_config_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"

- name: Render interactive proxy environment
  ansible.builtin.template:
    src: proxy-environment.sh.j2
    dest: "{{ forward_proxy_profile_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"

- name: Render process proxy environment
  ansible.builtin.template:
    src: proxy-environment.conf.j2
    dest: "{{ forward_proxy_environment_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"

- name: Render systemd proxy defaults
  ansible.builtin.template:
    src: systemd-environment.conf.j2
    dest: "{{ forward_proxy_systemd_environment_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"
  register: forward_proxy_systemd_environment_result

- name: Render client-container proxy defaults
  ansible.builtin.template:
    src: containers-proxy.conf.j2
    dest: "{{ forward_proxy_containers_config_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"
  when: forward_proxy_container_enabled | bool

- name: Remove previously owned client-container proxy defaults
  ansible.builtin.file:
    path: "{{ forward_proxy_containers_config_path }}"
    state: absent
  when:
    - not forward_proxy_container_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - >-
      forward_proxy_containers_config_path
      in (
        forward_proxy_previous_state_manifest
        | default({'managed_paths': []})
      ).managed_paths

- name: Reload systemd manager after changing proxy defaults
  ansible.builtin.systemd:
    daemon_reexec: true
    scope: "{{ forward_proxy_systemd_scope }}"
  when:
    - forward_proxy_manage_runtime | bool
    - forward_proxy_systemd_environment_result.changed

- name: Restart opted-in proxy client services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    scope: "{{ forward_proxy_systemd_scope }}"
  loop: "{{ forward_proxy_restart_services }}"
  when:
    - forward_proxy_manage_runtime | bool
    - forward_proxy_restart_clients | bool

- name: Manage the persistent Squid container service
  ansible.builtin.include_role:
    name: lit.foundational.podman_systemd
  vars:
    podman_systemd_action: >-
      {{
        'restarted'
        if (forward_proxy_squid_config_result.changed or forward_proxy_pod_manifest_result.changed)
        else 'present'
      }}
    podman_systemd_unit_name: "{{ forward_proxy_unit_name }}"
    podman_systemd_description: "LIT Squid forward proxy"
    podman_systemd_manifest_path: "{{ forward_proxy_pod_manifest_path }}"
    podman_systemd_scope: "{{ forward_proxy_systemd_scope }}"
    podman_systemd_quadlet_dir: "{{ forward_proxy_quadlet_dir }}"
    podman_systemd_enabled: true
  when: forward_proxy_manage_runtime | bool

- name: Wait for the local Squid listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ forward_proxy_port }}"
    state: started
    timeout: "{{ forward_proxy_readiness_timeout }}"
  when: forward_proxy_manage_runtime | bool
