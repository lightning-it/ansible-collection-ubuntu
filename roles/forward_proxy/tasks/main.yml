---
- name: Validate forward proxy configuration
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Inspect the forward proxy managed-state marker
  ansible.builtin.stat:
    path: "{{ forward_proxy_state_marker_path }}"
  register: forward_proxy_state_marker

- name: Read the forward proxy managed-state marker
  ansible.builtin.slurp:
    src: "{{ forward_proxy_state_marker_path }}"
  register: forward_proxy_state_marker_content
  when: forward_proxy_state_marker.stat.exists

- name: Decode the previous forward proxy managed state
  ansible.builtin.set_fact:
    forward_proxy_previous_state_manifest: >-
      {{ forward_proxy_state_marker_content.content | b64decode | from_json }}
  when: forward_proxy_state_marker.stat.exists

- name: Validate the exact previous forward proxy ownership manifest
  ansible.builtin.assert:
    that:
      - forward_proxy_previous_state_manifest is mapping
      - >-
        forward_proxy_previous_state_manifest.keys() | list | sort
        == ['managed_paths', 'owner', 'schema', 'unit_name']
      - forward_proxy_previous_state_manifest.schema == 'lit.ubuntu.forward_proxy.managed-state/v1'
      - forward_proxy_previous_state_manifest.owner == 'lit.ubuntu.forward_proxy'
      - forward_proxy_previous_state_manifest.unit_name == forward_proxy_unit_name
      - forward_proxy_previous_state_manifest.managed_paths is sequence
      - forward_proxy_previous_state_manifest.managed_paths is not string
      - >-
        forward_proxy_previous_state_manifest.managed_paths | unique | list | length
        == forward_proxy_previous_state_manifest.managed_paths | length
      - >-
        _forward_proxy_base_managed_paths
        | difference(forward_proxy_previous_state_manifest.managed_paths)
        | length == 0
      - >-
        forward_proxy_previous_state_manifest.managed_paths
        | difference(_forward_proxy_all_managed_paths)
        | length == 0
    fail_msg: >-
      Existing forward proxy state is not the exact role-owned manifest for
      this unit and path set. Stop before removing or replacing any file.
  when: forward_proxy_state_marker.stat.exists

- name: Remove a previously managed forward proxy runtime when disabled
  ansible.builtin.include_role:
    name: lit.foundational.podman_systemd
  vars:
    podman_systemd_action: absent
    podman_systemd_unit_name: "{{ forward_proxy_unit_name }}"
    podman_systemd_description: "LIT Squid forward proxy"
    podman_systemd_manifest_path: "{{ forward_proxy_pod_manifest_path }}"
    podman_systemd_scope: "{{ forward_proxy_systemd_scope }}"
    podman_systemd_quadlet_dir: "{{ forward_proxy_quadlet_dir }}"
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_manage_runtime | bool

- name: Remove forward proxy managed configuration when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      (forward_proxy_previous_state_manifest | default({'managed_paths': []})).managed_paths
    }}
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists

- name: Reload systemd manager after removing proxy defaults
  ansible.builtin.systemd:
    daemon_reexec: true
    scope: "{{ forward_proxy_systemd_scope }}"
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_manage_runtime | bool

- name: Restart opted-in proxy clients after disabling the proxy
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    scope: "{{ forward_proxy_systemd_scope }}"
  loop: "{{ forward_proxy_restart_services }}"
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_manage_runtime | bool

- name: Remove the forward proxy managed-state marker when disabled
  ansible.builtin.file:
    path: "{{ forward_proxy_state_marker_path }}"
    state: absent
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists

- name: Apply the enabled forward proxy state
  ansible.builtin.include_tasks: enabled.yml
  when: forward_proxy_enabled | bool
