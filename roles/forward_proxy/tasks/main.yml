---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Inspect the forward proxy managed-state marker
  ansible.builtin.stat:
    path: "{{ forward_proxy_state_marker_path }}"
    follow: false
  register: forward_proxy_state_marker
  when: not forward_proxy_enabled | bool

- name: Remove forward proxy managed configuration when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ forward_proxy_config_path }}"
    - "{{ forward_proxy_apt_config_path }}"
    - "{{ forward_proxy_profile_path }}"
    - "{{ forward_proxy_environment_path }}"
    - "{{ forward_proxy_systemd_environment_path }}"
    - "{{ forward_proxy_containers_config_path }}"
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists

- name: Inspect systemd services before disabled-state cleanup
  ansible.builtin.service_facts:
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_manage_service | bool

- name: Stop and mask the previously managed proxy when disabled
  ansible.builtin.systemd_service:
    name: "{{ forward_proxy_service_name }}"
    enabled: false
    state: stopped
    masked: true
  vars:
    forward_proxy_service_unit: >-
      {{ forward_proxy_service_name if forward_proxy_service_name.endswith('.service')
         else forward_proxy_service_name ~ '.service' }}
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_manage_service | bool
    - forward_proxy_service_unit in ansible_facts.services

- name: Reload systemd after removing managed proxy defaults
  ansible.builtin.systemd_service:
    daemon_reexec: true
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_manage_service | bool

- name: Restart opted-in clients after disabling proxy defaults
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ forward_proxy_restart_services }}"
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists
    - forward_proxy_manage_service | bool

- name: Remove the forward proxy managed-state marker when disabled
  ansible.builtin.file:
    path: "{{ forward_proxy_state_marker_path }}"
    state: absent
  when:
    - not forward_proxy_enabled | bool
    - forward_proxy_state_marker.stat.exists

- name: Stop when the forward proxy is disabled
  ansible.builtin.meta: end_role
  when: not forward_proxy_enabled | bool

- name: Install the forward proxy package
  ansible.builtin.apt:
    name: "{{ forward_proxy_package_name }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  when: forward_proxy_manage_package | bool

- name: Keep the package-bootstrap proxy service stopped and masked
  ansible.builtin.systemd_service:
    name: "{{ forward_proxy_service_name }}"
    enabled: false
    state: stopped
    masked: true
  when: forward_proxy_manage_package | bool

- name: Read back the package-bootstrap proxy listener state
  ansible.builtin.command:
    argv:
      - "{{ forward_proxy_ss_binary }}"
      - -H
      - -ltn
      - "sport = :{{ forward_proxy_port }}"
  register: forward_proxy_bootstrap_listener_readback
  changed_when: false
  failed_when: >-
    forward_proxy_bootstrap_listener_readback.rc != 0
    or forward_proxy_bootstrap_listener_readback.stdout | trim | length > 0
  when: forward_proxy_manage_package | bool

- name: Stop after the explicitly authorized bootstrap package phase
  ansible.builtin.meta: end_role
  when: forward_proxy_bootstrap_package_only | bool

- name: Create forward proxy configuration directories
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0755"
  loop:
    - "{{ forward_proxy_config_path }}"
    - "{{ forward_proxy_apt_config_path }}"
    - "{{ forward_proxy_profile_path }}"
    - "{{ forward_proxy_environment_path }}"
    - "{{ forward_proxy_systemd_environment_path }}"
    - "{{ forward_proxy_containers_config_path }}"
    - "{{ forward_proxy_state_marker_path }}"

- name: Render the closed forward proxy policy
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ forward_proxy_config_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0640"
  notify: Restart forward proxy

- name: Configure apt to use only the local forward proxy
  ansible.builtin.template:
    src: apt-proxy.conf.j2
    dest: "{{ forward_proxy_apt_config_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"

- name: Configure interactive process proxy environment
  ansible.builtin.template:
    src: proxy-environment.sh.j2
    dest: "{{ forward_proxy_profile_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"

- name: Configure environment generator proxy policy
  ansible.builtin.template:
    src: proxy-environment.conf.j2
    dest: "{{ forward_proxy_environment_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"

- name: Configure system service proxy defaults
  ansible.builtin.template:
    src: systemd-environment.conf.j2
    dest: "{{ forward_proxy_systemd_environment_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"
  register: forward_proxy_systemd_environment_result
  notify: Reload systemd configuration

- name: Apply proxy defaults before restarting opted-in clients
  ansible.builtin.meta: flush_handlers

- name: Restart opted-in services to activate the proxy environment
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ forward_proxy_restart_services }}"
  when:
    - forward_proxy_manage_service | bool
    - forward_proxy_systemd_environment_result.changed

- name: Configure Podman container proxy defaults
  ansible.builtin.template:
    src: containers-proxy.conf.j2
    dest: "{{ forward_proxy_containers_config_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0644"
  when: forward_proxy_container_enabled | bool

- name: Remove Podman proxy defaults while container access is closed
  ansible.builtin.file:
    path: "{{ forward_proxy_containers_config_path }}"
    state: absent
  when: not forward_proxy_container_enabled | bool

- name: Record that the role owns the managed forward proxy state
  ansible.builtin.copy:
    content: "lit.ubuntu.forward_proxy managed state\n"
    dest: "{{ forward_proxy_state_marker_path }}"
    owner: "{{ forward_proxy_file_owner }}"
    group: "{{ forward_proxy_file_group }}"
    mode: "0640"

- name: Enable and start the forward proxy
  ansible.builtin.systemd_service:
    name: "{{ forward_proxy_service_name }}"
    enabled: true
    state: started
    masked: false
  when: forward_proxy_manage_service | bool
