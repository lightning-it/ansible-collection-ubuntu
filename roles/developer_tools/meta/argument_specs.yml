---
argument_specs:
  main:
    short_description: Install developer packages, pip packages, and optional CLI tools on Ubuntu.
    options:
      developer_tools_enabled:
        type: bool
        default: true
      developer_tools_packages_present:
        type: list
        elements: str
      developer_tools_pip_executable:
        type: str
        default: pip3
      developer_tools_pip_packages_present:
        type: list
        elements: str
      developer_tools_pip_extra_args:
        type: str
        default: ""
      developer_tools_python_venv_enabled:
        type: bool
        default: false
      developer_tools_python_venv_path:
        type: path
        default: /opt/lit/developer-tools
      developer_tools_python_venv_python:
        type: str
        default: python3
      developer_tools_python_venv_support_packages:
        type: list
        elements: str
        default:
          - python3-venv
      developer_tools_python_venv_packages:
        type: list
        elements: str
        default: []
      developer_tools_python_venv_commands:
        type: list
        elements: str
        default: []
      developer_tools_python_venv_link_dir:
        type: path
        default: /usr/local/bin
      developer_tools_nodejs_enabled:
        type: bool
        default: false
      developer_tools_nodejs_package_source:
        type: str
        choices:
          - os
        default: os
      developer_tools_nodejs_package_state:
        type: str
        choices:
          - present
          - latest
        default: present
      developer_tools_nodejs_packages_present:
        type: list
        elements: str
        default:
          - nodejs
          - npm
      developer_tools_node_executable:
        type: str
        default: node
      developer_tools_npm_executable:
        type: str
        default: npm
      developer_tools_npx_executable:
        type: str
        default: npx
      developer_tools_nodejs_validate:
        type: bool
        default: true
      developer_tools_nodejs_expected_users:
        type: list
        elements: str
        default: []
      developer_tools_npm_packages_present:
        type: list
        elements: dict
        default: []
      developer_tools_node_options:
        type: str
        default: ""
      developer_tools_markdownlint_cli2_enabled:
        type: bool
        default: false
      developer_tools_markdownlint_cli2_install_mode:
        type: str
        choices:
          - global
          - npx
        default: global
      developer_tools_markdownlint_cli2_package_name:
        type: str
        default: markdownlint-cli2
      developer_tools_markdownlint_cli2_version:
        type: str
        default: ""
      developer_tools_markdownlint_cli2_validate:
        type: bool
        default: true
      developer_tools_github_cli_enabled:
        type: bool
        default: false
      developer_tools_github_cli_package_name:
        type: str
        default: gh
      developer_tools_github_cli_key_url:
        type: str
        default: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      developer_tools_github_cli_key_dest:
        type: str
        default: /etc/apt/keyrings/githubcli-archive-keyring.gpg
      developer_tools_github_cli_repo:
        type: str
        default: >-
          deb [arch={{ developer_tools_github_cli_deb_arch }} signed-by={{
          developer_tools_github_cli_key_dest }}] https://cli.github.com/packages stable main
      developer_tools_github_cli_deb_arch:
        type: str
        default: >-
          {{ 'arm64'
             if (ansible_architecture | default('x86_64')) in ['aarch64', 'arm64']
             else 'amd64' }}
      developer_tools_git_config_enabled:
        type: bool
        default: false
      developer_tools_git_config_users:
        type: list
        elements: dict
      developer_tools_git_config_credential_helper:
        type: str
        default: "!gh auth git-credential"
      developer_tools_git_config_credential_url:
        type: str
        default: https://github.com
      developer_tools_git_config_credential_use_http_path:
        type: bool
        default: true
      developer_tools_terminal_config_enabled:
        type: bool
        default: false
      developer_tools_terminal_config_users:
        type: list
        elements: str
      developer_tools_terminal_config_manage_tmux:
        type: bool
        default: true
      developer_tools_terminal_config_manage_screen:
        type: bool
        default: true
      developer_tools_terminal_config_tmux_path:
        type: str
        default: .tmux.conf
      developer_tools_terminal_config_screen_path:
        type: str
        default: .screenrc
      developer_tools_terminal_config_tmux_content:
        type: str
      developer_tools_terminal_config_screen_content:
        type: str
      developer_tools_workspace_enabled:
        type: bool
        default: false
      developer_tools_workspace_users:
        type: list
        elements: str
        default: []
      developer_tools_workspace_directories:
        type: list
        elements: str
        default:
          - sources
          - worktrees
          - artifacts
          - .cache/lit
      developer_tools_release_binary_cache_dir:
        type: path
        default: /var/cache/lit/developer-tools
      developer_tools_release_binaries:
        type: list
        elements: dict
        default: []
      developer_tools_argocd_cli_enabled:
        type: bool
        default: false
      developer_tools_argocd_cli_version:
        type: str
        default: v3.3.3
      developer_tools_argocd_cli_url:
        type: str
        default: >-
          https://github.com/argoproj/argo-cd/releases/download/{{
          developer_tools_argocd_cli_version }}/argocd-linux-amd64
      developer_tools_argocd_cli_dest:
        type: str
        default: /usr/local/bin/argocd
      developer_tools_terragrunt_enabled:
        type: bool
        default: false
      developer_tools_terragrunt_version:
        type: str
        default: v0.93.8
      developer_tools_terragrunt_arch:
        type: str
        default: >-
          {{ 'arm64'
             if (ansible_architecture | default('x86_64')) in ['aarch64', 'arm64']
             else 'amd64' }}
      developer_tools_terragrunt_url:
        type: str
        default: >-
          https://github.com/gruntwork-io/terragrunt/releases/download/{{
          developer_tools_terragrunt_version }}/terragrunt_linux_{{
          developer_tools_terragrunt_arch }}
      developer_tools_terragrunt_dest:
        type: str
        default: /usr/local/bin/terragrunt
      developer_tools_actionlint_enabled:
        type: bool
        default: false
      developer_tools_actionlint_version:
        type: str
        default: 1.7.12
      developer_tools_actionlint_arch:
        type: str
        default: >-
          {{ 'arm64'
             if (ansible_architecture | default('x86_64')) in ['aarch64', 'arm64']
             else 'amd64' }}
      developer_tools_actionlint_archive_url:
        type: str
        default: >-
          https://github.com/rhysd/actionlint/releases/download/v{{
          developer_tools_actionlint_version }}/actionlint_{{
          developer_tools_actionlint_version }}_linux_{{
          developer_tools_actionlint_arch }}.tar.gz
      developer_tools_actionlint_checksum_url:
        type: str
        default: >-
          https://github.com/rhysd/actionlint/releases/download/v{{
          developer_tools_actionlint_version }}/actionlint_{{
          developer_tools_actionlint_version }}_checksums.txt
      developer_tools_actionlint_archive_path:
        type: str
        default: >-
          /var/tmp/actionlint_{{ developer_tools_actionlint_version }}_linux_{{
          developer_tools_actionlint_arch }}.tar.gz
      developer_tools_actionlint_extract_dir:
        type: str
        default: "/var/tmp/actionlint-{{ developer_tools_actionlint_version }}"
      developer_tools_actionlint_dest:
        type: str
        default: /usr/local/bin/actionlint
      developer_tools_packer_enabled:
        type: bool
        default: false
      developer_tools_packer_version:
        type: str
        default: 1.15.4
      developer_tools_packer_arch:
        type: str
        default: >-
          {{ 'arm64'
             if (ansible_architecture | default('x86_64')) in ['aarch64', 'arm64']
             else 'amd64' }}
      developer_tools_packer_archive_url:
        type: str
      developer_tools_packer_archive_path:
        type: path
      developer_tools_packer_checksum:
        type: str
        default: ""
      developer_tools_packer_extract_dir:
        type: path
      developer_tools_packer_dest:
        type: path
        default: /usr/local/bin/packer
      developer_tools_packer_unzip_package_name:
        type: str
        default: unzip
      developer_tools_oc_cli_enabled:
        type: bool
        default: false
      developer_tools_oc_cli_version:
        type: str
        default: 4.18.24
      developer_tools_oc_cli_archive_url:
        type: str
        default: >-
          https://mirror.openshift.com/pub/openshift-v4/clients/ocp/{{
          developer_tools_oc_cli_version
          }}/openshift-client-linux-{{
          developer_tools_oc_cli_version }}.tar.gz
      developer_tools_oc_cli_checksum:
        type: str
        default: ""
      developer_tools_oc_cli_archive_path:
        type: str
        default: >-
          /var/tmp/openshift-client-linux-{{
          developer_tools_oc_cli_version }}.tar.gz
      developer_tools_oc_cli_extract_dir:
        type: str
        default: "/var/tmp/openshift-client-{{ developer_tools_oc_cli_version }}"
      developer_tools_oc_cli_dest:
        type: str
        default: /usr/local/bin/oc
      developer_tools_kubectl_cli_enabled:
        type: bool
        default: false
      developer_tools_kubectl_cli_dest:
        type: str
        default: /usr/local/bin/kubectl
      developer_tools_ssh_agent_enabled:
        type: bool
        default: false
      developer_tools_ssh_agent_users:
        type: list
        elements: str
      developer_tools_ssh_agent_identity_files:
        type: list
        elements: str
        default:
          - ~/.ssh/id_ed25519
      developer_tools_ssh_agent_package_name:
        type: str
        default: openssh-client
      developer_tools_ssh_agent_service_name:
        type: str
        default: ssh-agent.service
      developer_tools_ssh_agent_socket:
        type: str
        default: "%t/ssh-agent.socket"
      developer_tools_ssh_agent_manage_shell_init:
        type: bool
        default: true
      developer_tools_ssh_agent_shell_init_files:
        type: list
        elements: str
        default:
          - .bash_profile
          - .bashrc
      developer_tools_ssh_agent_manage_ssh_config:
        type: bool
        default: true
      developer_tools_ssh_agent_add_keys_to_agent:
        type: bool
        default: true
      developer_tools_ssh_private_keys_enabled:
        type: bool
        default: false
      developer_tools_ssh_private_keys:
        type: list
        elements: dict
      developer_tools_ssh_private_keys_no_log:
        type: bool
        default: true
      developer_tools_ssh_private_keys_path:
        type: str
        default: .ssh/id_ed25519
      developer_tools_ssh_private_keys_type:
        type: str
        default: ed25519
      developer_tools_ssh_private_keys_manage_public_keys:
        type: bool
        default: true
      developer_tools_ssh_private_keys_known_hosts_entries:
        type: list
        elements: dict
      developer_tools_ssh_private_keys_vault_addr:
        type: str
        default: ""
      developer_tools_ssh_private_keys_vault_validate_certs:
        type: bool
        default: false
      developer_tools_ssh_private_keys_vault_kv_mount:
        type: str
        default: ""
      developer_tools_ssh_private_keys_vault_token:
        type: str
        default: ""
      developer_tools_ssh_private_keys_vault_role_id:
        type: str
        default: ""
      developer_tools_ssh_private_keys_vault_secret_id:
        type: str
        default: ""
      developer_tools_ssh_private_keys_vault_use_token:
        type: bool
        default: "{{ (developer_tools_ssh_private_keys_vault_token | string | trim | length) > 0 }}"
      developer_tools_ssh_private_keys_vault_auth_method:
        type: str
        default: >-
          {{ 'token' if (developer_tools_ssh_private_keys_vault_use_token | bool) else 'approle' }}
      developer_tools_ssh_private_keys_vault_auth_ok:
        type: bool
        default: >-
          {{
            (developer_tools_ssh_private_keys_vault_token | string | trim | length > 0)
            or (
              (developer_tools_ssh_private_keys_vault_role_id | string | trim | length > 0)
              and (developer_tools_ssh_private_keys_vault_secret_id | string | trim | length > 0)
            )
          }}
      developer_tools_ssh_private_keys_vault_path_prefix:
        type: str
        default: "{{ inventory_hostname }}/developer_tools/ssh_keys"
