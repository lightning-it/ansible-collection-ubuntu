---
- name: Inspect Podman AppArmor repair inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - "{{ podman_apparmor_profile_path }}"
    - "{{ podman_apparmor_parser_path }}"
  register: podman_apparmor_inputs
  when: >-
    podman_apparmor_profile_reload | bool
    or podman_buildah_apparmor_profile_reload | bool
    or podman_helper_apparmor_profiles | length > 0

- name: Inspect Buildah AppArmor repair inputs
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - "{{ podman_buildah_apparmor_profile_path }}"
    - "{{ podman_apparmor_parser_path }}"
  register: podman_buildah_apparmor_input
  when: podman_buildah_apparmor_profile_reload | bool

- name: Validate Buildah AppArmor repair inputs
  ansible.builtin.assert:
    that:
      - podman_buildah_apparmor_input.results[0].stat.isreg | default(false)
      - podman_buildah_apparmor_input.results[1].stat.isreg | default(false)
      - podman_buildah_apparmor_input.results[1].stat.executable | default(false)
    fail_msg: >-
      Buildah AppArmor repair requires an existing profile file and an
      executable AppArmor parser.
  when: podman_buildah_apparmor_profile_reload | bool

- name: Inspect helper AppArmor repair inputs
  ansible.builtin.stat:
    path: "{{ item.profile_path }}"
    follow: true
  loop: "{{ podman_helper_apparmor_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  register: podman_helper_apparmor_inputs

- name: Validate helper AppArmor repair inputs
  ansible.builtin.assert:
    that:
      - podman_helper_apparmor_inputs.results[index].stat.isreg | default(false)
    fail_msg: >-
      Helper AppArmor repair requires safe names, absolute paths, and an
      existing profile file.
  loop: "{{ podman_helper_apparmor_profiles }}"
  loop_control:
    index_var: index
    label: "{{ item.name }}"

- name: Validate Podman AppArmor repair inputs
  ansible.builtin.assert:
    that:
      - podman_apparmor_inputs.results[0].stat.isreg | default(false)
      - podman_apparmor_inputs.results[1].stat.isreg | default(false)
      - podman_apparmor_inputs.results[1].stat.executable | default(false)
    fail_msg: >-
      Podman AppArmor repair requires an existing profile file and an
      executable AppArmor parser.
  when: podman_apparmor_profile_reload | bool

- name: Read the Buildah AppArmor profile before repair
  ansible.builtin.slurp:
    src: "{{ podman_buildah_apparmor_profile_path }}"
  register: podman_buildah_apparmor_profile_source
  when: podman_buildah_apparmor_profile_reload | bool

- name: Read the Podman AppArmor profile before repair
  ansible.builtin.slurp:
    src: "{{ podman_apparmor_profile_path }}"
  register: podman_apparmor_profile_source
  when: podman_apparmor_profile_reload | bool

- name: Require a recognized Buildah AppArmor profile header
  ansible.builtin.assert:
    that:
      - >-
        (podman_buildah_apparmor_profile_source.content | b64decode)
        is search(
          '(?m)^profile\\s+buildah(?:\\s+flags=\\([^)]*\\))?'
          ~ '\\s+/usr/bin/buildah(?:\\s+flags=\\([^)]*\\))?\\s*\\{$',
          multiline=True
        )
    fail_msg: >-
      Refusing to modify the Buildah AppArmor profile because its header is
      not recognized.
  when: podman_buildah_apparmor_profile_reload | bool

- name: Read helper AppArmor profiles before repair
  ansible.builtin.slurp:
    src: "{{ item.profile_path }}"
  loop: "{{ podman_helper_apparmor_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  register: podman_helper_apparmor_profile_sources

- name: Require recognized helper AppArmor profile headers
  ansible.builtin.assert:
    that:
      - >-
        (podman_helper_apparmor_profile_sources.results[index].content | b64decode)
        is search(
          '(?m)^profile\\s+' ~ (item.name | regex_escape)
          ~ '(?:\\s+flags=\\([^)]*\\))?\\s+' ~ (item.executable | regex_escape)
          ~ '(?:\\s+flags=\\([^)]*\\))?\\s*\\{$',
          multiline=True
        )
    fail_msg: >-
      Refusing to modify helper AppArmor profile {{ item.name }} because its
      header is not recognized.
  loop: "{{ podman_helper_apparmor_profiles }}"
  loop_control:
    index_var: index
    label: "{{ item.name }}"

- name: Require a recognized Podman AppArmor profile header
  ansible.builtin.assert:
    that:
      - >-
        (podman_apparmor_profile_source.content | b64decode)
        is search(
          '(?m)^profile\\s+podman(?:\\s+flags=\\([^)]*\\))?'
          ~ '\\s+/usr/bin/podman(?:\\s+flags=\\([^)]*\\))?\\s*\\{$',
          multiline=True
        )
    fail_msg: >-
      Refusing to modify the Podman AppArmor profile because its header is not
      recognized.
  when: podman_apparmor_profile_reload | bool
