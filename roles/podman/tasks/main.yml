---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Install podman toolchain
  ansible.builtin.package:
    name: "{{ podman_packages }}"
    state: present
  when: podman_packages | length > 0

- name: Ensure registries.conf directory exists
  ansible.builtin.file:
    path: "{{ podman_registries_conf_dir }}"
    state: directory
    mode: "0755"

- name: Restore and reload the package-compatible Podman AppArmor profile
  when: podman_apparmor_profile_reload | bool
  block:
    - name: Restore the unconfined Podman AppArmor attachment profile
      ansible.builtin.lineinfile:
        path: "{{ podman_apparmor_profile_path }}"
        regexp: '^profile\s+podman(?:\s+flags=\([^)]*\))?\s+/usr/bin/podman(?:\s+flags=\([^)]*\))?\s*\{$'
        line: 'profile podman /usr/bin/podman flags=(unconfined) {'
        state: present
      register: podman_apparmor_profile

    - name: Reload the Podman AppArmor profile
      ansible.builtin.command:
        argv:
          - "{{ podman_apparmor_parser_path }}"
          - --replace
          - "{{ podman_apparmor_profile_path }}"
      when:
        - not ansible_check_mode
        - podman_apparmor_profile.changed
      changed_when: false

- name: Restore and reload the package-compatible Buildah AppArmor profile
  when: podman_buildah_apparmor_profile_reload | bool
  block:
    - name: Restore the unconfined Buildah AppArmor attachment profile
      ansible.builtin.lineinfile:
        path: "{{ podman_buildah_apparmor_profile_path }}"
        regexp: '^profile\s+buildah(?:\s+flags=\([^)]*\))?\s+/usr/bin/buildah(?:\s+flags=\([^)]*\))?\s*\{$'
        line: 'profile buildah /usr/bin/buildah flags=(unconfined) {'
        state: present
      register: podman_buildah_apparmor_profile

    - name: Reload the Buildah AppArmor profile
      ansible.builtin.command:
        argv:
          - "{{ podman_apparmor_parser_path }}"
          - --replace
          - "{{ podman_buildah_apparmor_profile_path }}"
      when:
        - not ansible_check_mode
        - podman_buildah_apparmor_profile.changed
      changed_when: false

- name: Remove invalid trailing helper AppArmor profile headers
  ansible.builtin.replace:
    path: "{{ item.profile_path }}"
    regexp: >-
      (?m)^profile {{ item.name }} {{ item.executable | regex_escape }}
      flags=\(unconfined\) \{\s*\Z
    replace: ""
  loop: "{{ podman_helper_apparmor_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  register: podman_helper_apparmor_trailing_headers

- name: Restore unconfined helper AppArmor attachment profiles
  ansible.builtin.lineinfile:
    path: "{{ item.profile_path }}"
    regexp: >-
      {{
        '^profile[ ]+' ~ (item.name | regex_escape)
        ~ '(?:[ ]+flags=[(][^)]+[)])?[ ]+'
        ~ (item.executable | regex_escape)
        ~ '(?:[ ]+flags=[(][^)]+[)])?[ ]*[{]$'
      }}
    line: "profile {{ item.name }} {{ item.executable }} flags=(unconfined) {"
    state: present
  loop: "{{ podman_helper_apparmor_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  register: podman_helper_apparmor_headers

- name: Reload helper AppArmor attachment profiles
  ansible.builtin.command:
    argv:
      - "{{ podman_apparmor_parser_path }}"
      - --replace
      - "{{ item.profile_path }}"
  loop: "{{ podman_helper_apparmor_profiles }}"
  when:
    - not ansible_check_mode
    - >-
      podman_helper_apparmor_trailing_headers.results[index].changed
      or podman_helper_apparmor_headers.results[index].changed
  loop_control:
    index_var: index
    label: "{{ item.name }}"
  changed_when: false

- name: Validate the direct Podman executable
  ansible.builtin.command:
    argv:
      - "{{ podman_executable_path }}"
      - --version
  when:
    - podman_validate_executable | bool
    - >-
      not ansible_check_mode or
      not (podman_apparmor_profile | default({'changed': false})).changed
  changed_when: false

- name: Reconcile the system Podman API socket
  ansible.builtin.systemd_service:
    name: "{{ podman_system_socket_service_name }}"
    enabled: "{{ podman_system_socket_enabled | bool }}"
    state: "{{ (podman_system_socket_enabled | bool) | ternary('started', 'stopped') }}"
  when: podman_system_socket_manage | bool or podman_system_socket_enabled | bool

- name: Configure rootless Podman API sockets
  ansible.builtin.include_tasks: user_socket.yml
  when: podman_user_socket_enabled | bool
