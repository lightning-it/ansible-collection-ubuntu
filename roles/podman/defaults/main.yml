---
podman_packages:
  - podman
  - buildah

podman_registries_conf_dir: /etc/containers

podman_apparmor_profile_reload: false
podman_apparmor_profile_path: /etc/apparmor.d/podman
podman_buildah_apparmor_profile_reload: false
podman_buildah_apparmor_profile_path: /etc/apparmor.d/buildah
podman_helper_apparmor_profiles: []
podman_apparmor_parser_path: /usr/sbin/apparmor_parser
podman_executable_path: /usr/bin/podman
podman_validate_executable: false

podman_system_socket_enabled: false
podman_system_socket_manage: false
podman_system_socket_service_name: podman.socket

podman_user_socket_enabled: false
podman_user_socket_users: []
podman_user_socket_service_name: podman.socket
podman_user_socket_manage_linger: true
podman_user_socket_start_user_manager: true
podman_user_socket_manage_shell_init: true
podman_user_socket_shell_init_files:
  - .bash_profile
  - .bashrc
