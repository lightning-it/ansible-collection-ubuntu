---
- name: Preview the private early VLAN artifact changes without writing them
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "{{ item.path }}"
    follow: false
    owner: root
    group: root
    mode: '0755'
  loop:
    - template: initramfs-early-vlans.sh.j2
      path: "{{ luks_unlock_early_vlan_script_path }}"
    - template: initramfs-vlan-hook.sh.j2
      path: "{{ luks_unlock_early_vlan_hook_path }}"
  check_mode: true
  diff: false
  register: luks_unlock_early_vlan_preview

- name: Inspect the pending early VLAN installation receipt
  ansible.builtin.stat:
    path: "{{ luks_unlock_early_vlan_script_path }}.lit-install-pending"
    follow: false
  register: luks_unlock_early_vlan_pending

- name: Inspect the pending early VLAN cleanup receipt before re-enabling
  ansible.builtin.stat:
    path: "{{ luks_unlock_early_vlan_script_path }}.lit-cleanup-pending"
    follow: false
  register: luks_unlock_early_vlan_cleanup_pending

- name: Require a rebuild before changing or retrying early VLAN boot artifacts
  ansible.builtin.assert:
    that:
      - luks_unlock_rebuild_initramfs | bool
    quiet: true
  when: >-
    luks_unlock_early_vlan_preview.changed or luks_unlock_early_vlan_pending.stat.exists
    or luks_unlock_early_vlan_cleanup_pending.stat.exists

# Persist before changing either source; interrupted/failed rebuilds retry even
# when both rendered sources already match on the next apply.
- name: Reconcile the private early VLAN boot image transaction
  when: >-
    luks_unlock_early_vlan_preview.changed or luks_unlock_early_vlan_pending.stat.exists
    or luks_unlock_early_vlan_cleanup_pending.stat.exists
  block:
    - name: Persist the pending early VLAN installation
      ansible.builtin.copy:
        dest: "{{ luks_unlock_early_vlan_script_path }}.lit-install-pending"
        content: "Early VLAN installation requires a successful initramfs rebuild.\n"
        owner: root
        group: root
        mode: '0600'
        follow: false

    - name: Render the optional private early VLAN boot artifacts
      ansible.builtin.template:
        src: "{{ item.template }}"
        dest: "{{ item.path }}"
        follow: false
        owner: root
        group: root
        mode: '0755'
      loop:
        - template: initramfs-early-vlans.sh.j2
          path: "{{ luks_unlock_early_vlan_script_path }}"
        - template: initramfs-vlan-hook.sh.j2
          path: "{{ luks_unlock_early_vlan_hook_path }}"

    - name: Rebuild the boot image before completing early VLAN installation
      ansible.builtin.command:
        argv: "{{ luks_unlock_update_initramfs_command }}"
      changed_when: true
      when: not ansible_check_mode

    - name: Clear both successfully rebuilt early VLAN transactions
      ansible.builtin.file:
        path: "{{ luks_unlock_early_vlan_script_path }}{{ item }}"
        state: absent
        follow: false
      loop:
        - .lit-install-pending
        - .lit-cleanup-pending
      when: not ansible_check_mode
