---
- name: Install Clevis initramfs packages
  ansible.builtin.apt:
    name: "{{ luks_unlock_clevis_packages }}"
    state: present
    update_cache: "{{ luks_unlock_update_apt_cache | bool }}"
  notify: LUKS unlock | Rebuild initramfs
  when: luks_unlock_manage_packages | bool

- name: Encrypt fixed preflight data with the pinned Tang policy
  ansible.builtin.command:
    argv:
      - clevis
      - encrypt
      - tang
      - "{{ luks_unlock_clevis_tang_policy_effective | to_json }}"
      - -y
    stdin: "{{ luks_unlock_clevis_probe_plaintext }}"
    stdin_add_newline: false
  register: luks_unlock_clevis_probe_jwe
  changed_when: false
  check_mode: false
  no_log: true

- name: Decrypt fixed Tang preflight data
  ansible.builtin.command:
    argv:
      - clevis
      - decrypt
    stdin: "{{ luks_unlock_clevis_probe_jwe.stdout }}"
    stdin_add_newline: false
  register: luks_unlock_clevis_probe_result
  changed_when: false
  check_mode: false
  no_log: true

- name: Confirm the pinned Tang policy is usable
  ansible.builtin.assert:
    that:
      - luks_unlock_clevis_probe_result.stdout == luks_unlock_clevis_probe_plaintext
    fail_msg: "Tang preflight failed; no LUKS metadata was changed."

- name: Reconcile Clevis binding for each declared LUKS2 device
  ansible.builtin.include_tasks: clevis_device.yml
  loop: "{{ luks_unlock_devices }}"
  loop_control:
    loop_var: luks_unlock_device
    label: "{{ luks_unlock_device.id }}"
