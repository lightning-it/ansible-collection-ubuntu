---
- name: Validate common LUKS unlock inputs
  ansible.builtin.assert:
    that:
      - luks_unlock_enabled is boolean
      - luks_unlock_execution_mode in ['installed', 'rescue_stage']
      - luks_unlock_manage_packages is boolean
      - luks_unlock_update_apt_cache is boolean
      - luks_unlock_manage_early_network is boolean
      - luks_unlock_update_grub is boolean
      - luks_unlock_rebuild_initramfs is boolean
      - luks_unlock_force_rebuild_initramfs is boolean
      - luks_unlock_validate_dropbear_host_keys is boolean
      - luks_unlock_allow_luks_metadata_change is boolean
      - luks_unlock_header_backup_confirmed is boolean
      - luks_unlock_dropbear_packages is sequence
      - luks_unlock_dropbear_packages is not string
      - luks_unlock_clevis_packages is sequence
      - luks_unlock_clevis_packages is not string
      - luks_unlock_network_modules is sequence
      - luks_unlock_network_modules is not string
      - luks_unlock_update_grub_command is sequence
      - luks_unlock_update_grub_command is not string
      - luks_unlock_update_initramfs_command is sequence
      - luks_unlock_update_initramfs_command is not string
    fail_msg: "Common luks_unlock variables are invalid."

- name: Validate enabled LUKS unlock inputs
  ansible.builtin.assert:
    that:
      - luks_unlock_method in ['dropbear', 'clevis_tang']
      - luks_unlock_early_network is mapping
      - luks_unlock_early_network.method | default('') in ['static', 'dhcp']
      - luks_unlock_early_network.interface | default('', true) | trim | length > 0
      - luks_unlock_early_network.interface is match('^[A-Za-z0-9_.-]+$')
      - luks_unlock_early_network.dns | default([]) is sequence
      - luks_unlock_early_network.dns | default([]) is not string
      - luks_unlock_early_network.dns | default([]) | length <= 2
      - luks_unlock_grub_dropin_path is match('^/')
      - luks_unlock_initramfs_modules_path is match('^/')
    fail_msg: "Enabled luks_unlock networking or method variables are invalid."
  when: luks_unlock_enabled | bool

- name: Validate static early-boot network inputs
  ansible.builtin.assert:
    that:
      - luks_unlock_early_network.address | default('', true) | trim | length > 0
      - luks_unlock_early_network.gateway | default('', true) | trim | length > 0
      - luks_unlock_early_network.netmask | default('', true) | trim | length > 0
      - luks_unlock_early_network.hostname | default('', true) | trim | length > 0
      - luks_unlock_early_network.address is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - luks_unlock_early_network.gateway is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - luks_unlock_early_network.netmask is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - luks_unlock_early_network.address.split('.') | map('int') | max <= 255
      - luks_unlock_early_network.gateway.split('.') | map('int') | max <= 255
      - luks_unlock_early_network.netmask.split('.') | map('int') | max <= 255
      - luks_unlock_early_network.hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
    fail_msg: "Static early-boot networking requires address, gateway, netmask, hostname, and interface."
  when:
    - luks_unlock_enabled | bool
    - luks_unlock_early_network.method | default('static') == 'static'

- name: Validate early-boot DNS addresses
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - item.split('.') | map('int') | max <= 255
    fail_msg: "Early-boot DNS currently supports valid IPv4 addresses only."
  loop: "{{ luks_unlock_early_network.dns | default([]) }}"
  when: luks_unlock_enabled | bool

- name: Validate initramfs network module names
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9_+-]+$')
    fail_msg: "Each initramfs network module must be a plain kernel module name."
  loop: "{{ luks_unlock_network_modules }}"
  when: luks_unlock_enabled | bool

- name: Validate Dropbear inputs
  ansible.builtin.assert:
    that:
      - luks_unlock_dropbear_port | int >= 1
      - luks_unlock_dropbear_port | int <= 65535
      - luks_unlock_dropbear_idle_timeout | int >= 0
      - luks_unlock_dropbear_keep_network_up is boolean
      - luks_unlock_dropbear_authorized_keys is sequence
      - luks_unlock_dropbear_authorized_keys is not string
      - luks_unlock_dropbear_authorized_keys | length > 0
      - luks_unlock_dropbear_config_path is match('^/')
      - luks_unlock_dropbear_authorized_keys_path is match('^/')
      - luks_unlock_dropbear_host_key_paths is sequence
      - luks_unlock_dropbear_host_key_paths is not string
    fail_msg: "Dropbear initramfs variables are invalid."
  when:
    - luks_unlock_enabled | bool
    - luks_unlock_method == 'dropbear'

- name: Validate Dropbear public keys
  ansible.builtin.assert:
    that:
      - item is string
      - "'\n' not in item"
      - "'\r' not in item"
      - item is match('^(ssh-|ecdsa-|sk-)[^ ]+[ ][^ ]+')
      - not item.startswith('-----BEGIN')
    fail_msg: "Dropbear entries must be single-line public SSH keys without preconfigured options."
  loop: "{{ luks_unlock_dropbear_authorized_keys }}"
  no_log: true
  when:
    - luks_unlock_enabled | bool
    - luks_unlock_method == 'dropbear'

- name: Validate Rescue staging inputs
  ansible.builtin.assert:
    that:
      - luks_unlock_method == 'dropbear'
      - luks_unlock_rescue_stage_path is match('^/')
    fail_msg: >-
      Rescue staging intentionally supports Dropbear only. Add Clevis after the first boot,
      once Tang availability and its signing thumbprint have been verified.
  when:
    - luks_unlock_enabled | bool
    - luks_unlock_execution_mode == 'rescue_stage'

- name: Validate Clevis Tang inputs
  ansible.builtin.assert:
    that:
      - luks_unlock_clevis_tang_url is match('^https?://[^/ ]+')
      - luks_unlock_clevis_tang_thumbprint | trim | length > 0
      - luks_unlock_clevis_network_timeout_seconds is integer
      - luks_unlock_clevis_network_timeout_seconds >= 1
      - luks_unlock_clevis_network_timeout_seconds <= 600
      - luks_unlock_clevis_tang_policy_effective is mapping
      - luks_unlock_clevis_tang_policy_effective | length == 2
      - luks_unlock_clevis_tang_policy_effective.url == luks_unlock_clevis_tang_url
      - luks_unlock_clevis_tang_policy_effective.thp == luks_unlock_clevis_tang_thumbprint
      - luks_unlock_clevis_tang_stored_policy_effective is mapping
      - luks_unlock_clevis_tang_stored_policy_effective | length == 1
      - luks_unlock_clevis_tang_stored_policy_effective.url == luks_unlock_clevis_tang_url
      - luks_unlock_devices is sequence
      - luks_unlock_devices is not string
      - luks_unlock_devices | length > 0
      - luks_unlock_existing_passphrases is mapping
      - luks_unlock_clevis_probe_plaintext | trim | length > 0
      - luks_unlock_crypttab_path is match('^/')
    fail_msg: "Clevis Tang variables are invalid or incomplete."
  when:
    - luks_unlock_enabled | bool
    - luks_unlock_method == 'clevis_tang'

- name: Validate forced Clevis initramfs recovery
  ansible.builtin.assert:
    that:
      - luks_unlock_rebuild_initramfs | bool
    fail_msg: >-
      luks_unlock_force_rebuild_initramfs requires luks_unlock_rebuild_initramfs=true
      in installed clevis_tang mode.
  when:
    - luks_unlock_enabled | bool
    - luks_unlock_execution_mode == 'installed'
    - luks_unlock_method == 'clevis_tang'
    - luks_unlock_force_rebuild_initramfs | bool

- name: Validate Clevis device declarations
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.id | default('', true) | trim | length > 0
      - >-
        (item.device | default('', true) | trim | length > 0)
        != (item.crypttab_name | default('', true) | trim | length > 0)
      - >-
        item.device | default('', true) | trim | length == 0
        or item.device is match('^/')
      - item.keyslot is defined
      - item.keyslot | int >= 1
      - item.keyslot | int <= 31
      - item.initramfs | default(true) is boolean
      - item.initramfs | default(true) | bool
    fail_msg: >-
      Each Clevis device requires id, exactly one of absolute device or crypttab_name,
      an explicit keyslot from 1 through 31, and initramfs=true.
  loop: "{{ luks_unlock_devices }}"
  loop_control:
    label: "{{ item.id | default('unnamed-device') }}"
  when:
    - luks_unlock_enabled | bool
    - luks_unlock_method == 'clevis_tang'
