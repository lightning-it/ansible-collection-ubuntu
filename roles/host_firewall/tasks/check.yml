---
- name: Ask nftables to check the complete candidate transaction
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_nft_binary }}"
      - --check
      - --file
      - '-'
    stdin: "{{ host_firewall_candidate_content }}"
  register: host_firewall_check_result
  changed_when: false
  check_mode: false

- name: Confirm nftables executed and accepted the candidate transaction
  ansible.builtin.assert:
    that:
      - not host_firewall_check_result.skipped | default(false)
      - host_firewall_check_result.rc is defined
      - host_firewall_check_result.rc == 0
    fail_msg: >-
      nftables did not execute the complete candidate check or rejected it; skipped check-mode validation never
      authorizes a later apply.
