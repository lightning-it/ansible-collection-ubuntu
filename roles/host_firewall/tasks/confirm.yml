---
- name: Stage exact signed confirmation request under the transaction lock
  ansible.builtin.command:
    argv: "{{ host_firewall_transaction_program_argv + ['stage-confirm'] }}"
    stdin: "{{ host_firewall_transaction_request | to_json | b64encode }}"
    stdin_add_newline: false
  register: host_firewall_confirmation_stage_command
  changed_when: true

- name: Parse exact confirmation staging result
  ansible.builtin.set_fact:
    host_firewall_confirmation_stage: "{{ host_firewall_confirmation_stage_command.stdout | from_json }}"

- name: Validate exact confirmation staging boundary
  ansible.builtin.assert:
    that:
      - >-
        host_firewall_confirmation_stage.keys() | list | sort
        == ['confirmation_path', 'schema', 'transaction_id', 'transaction_path']
      - host_firewall_confirmation_stage.schema == 'lit.host_firewall.confirm-stage/v3'
      - host_firewall_confirmation_stage.transaction_id is match('^[a-f0-9]{32}\\Z')
      - >-
        host_firewall_confirmation_stage.transaction_path
        == host_firewall_transactions_directory + '/' + host_firewall_confirmation_stage.transaction_id
      - >-
        host_firewall_confirmation_stage.confirmation_path
        == host_firewall_confirmation_stage.transaction_path + '/terminal.json'
    fail_msg: "The transaction routine returned an invalid or escaped confirmation path."

- name: Start locked static host firewall confirmation service
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_systemctl_binary }}"
      - start
      - "{{ host_firewall_confirmation_service_name }}"
  changed_when: true

- name: Reset protected remote control connection after firewall confirmation
  ansible.builtin.include_tasks: reset_connection.yml
  when: ansible_connection | default('ssh') != 'local'

- name: Wait for protected control connection after firewall confirmation
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    sleep: 2
    timeout: 45
  when: ansible_connection | default('ssh') != 'local'

- name: Read immutable host firewall confirmation record
  ansible.builtin.slurp:
    src: "{{ host_firewall_confirmation_stage.confirmation_path }}"
  register: host_firewall_confirmation_record_raw
  changed_when: false

- name: Parse immutable host firewall confirmation record
  ansible.builtin.set_fact:
    host_firewall_confirmation_record: "{{ host_firewall_confirmation_record_raw.content | b64decode | from_json }}"

- name: Require exact host firewall confirmation evidence
  ansible.builtin.assert:
    that:
      - >-
        host_firewall_confirmation_record.keys() | list | sort
        == [
          'approved_readback_sha256',
          'authorization_claim_id',
          'authorization_sha256',
          'authorization_verification_sha256',
          'candidate_sha256',
          'change_id',
          'confirmed_at',
          'egress_policy_sha256',
          'egress_status',
          'policy_fingerprint',
          'schema',
          'target',
          'transaction_id'
        ]
      - host_firewall_confirmation_record.schema == 'lit.host_firewall.confirmation/v3'
      - host_firewall_confirmation_record.transaction_id == host_firewall_confirmation_stage.transaction_id
      - host_firewall_confirmation_record.target == host_firewall_expected_inventory_hostname
      - host_firewall_confirmation_record.change_id == host_firewall_change_id
      - host_firewall_confirmation_record.candidate_sha256 == host_firewall_candidate_sha256
      - host_firewall_confirmation_record.approved_readback_sha256 == host_firewall_approved_readback_sha256
      - host_firewall_confirmation_record.policy_fingerprint == host_firewall_policy_fingerprint
      - host_firewall_confirmation_record.egress_policy_sha256 == host_firewall_egress_policy_sha256
      - host_firewall_confirmation_record.egress_status == 'approved'
      - host_firewall_confirmation_record.authorization_claim_id == host_firewall_authorization_contract.claim_id
      - host_firewall_confirmation_record.authorization_sha256 is match('^[a-f0-9]{64}\\Z')
      - host_firewall_confirmation_record.authorization_verification_sha256 is match('^[a-f0-9]{64}\\Z')
      - >-
        host_firewall_confirmation_record.confirmed_at
        is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\\Z')
    fail_msg: "The static confirmation service returned without exact approved completion evidence."
