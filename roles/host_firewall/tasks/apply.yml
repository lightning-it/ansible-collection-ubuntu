---
- name: Inspect prior host firewall transaction state
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ host_firewall_pending_metadata_path }}"
    - "{{ host_firewall_confirmation_path }}"
    - "{{ host_firewall_rollback_record_path }}"
  register: host_firewall_prior_transaction_state
  changed_when: false

- name: Refuse to overwrite an unresolved host firewall transaction
  ansible.builtin.assert:
    that:
      - >-
        not host_firewall_prior_transaction_state.results[0].stat.exists
        or host_firewall_prior_transaction_state.results[1].stat.exists
        or host_firewall_prior_transaction_state.results[2].stat.exists
    fail_msg: >-
      A pending firewall transaction has neither confirmation nor rollback evidence and must be resolved first.

- name: Create protected host firewall transaction state directory
  ansible.builtin.file:
    path: "{{ host_firewall_state_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect shared host firewall program and systemd directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ host_firewall_apply_script_path | dirname }}"
    - "{{ host_firewall_systemd_unit_directory }}"
  register: host_firewall_shared_directory_stats
  changed_when: false

- name: Require safe preprovisioned shared host firewall directories
  ansible.builtin.assert:
    that:
      - host_firewall_shared_directory_stats.results | map(attribute='stat.exists') | min
      - host_firewall_shared_directory_stats.results | map(attribute='stat.isdir') | min
      - not host_firewall_shared_directory_stats.results | map(attribute='stat.islnk') | max
      - host_firewall_shared_directory_stats.results | map(attribute='stat.uid') | min == 0
      - host_firewall_shared_directory_stats.results | map(attribute='stat.uid') | max == 0
      - host_firewall_apply_script_path | dirname == host_firewall_rollback_script_path | dirname
      - host_firewall_apply_script_path | dirname == host_firewall_confirmation_script_path | dirname
      - host_firewall_apply_script_path | dirname == host_firewall_canonicalizer_script_path | dirname
    fail_msg: >-
      Program and systemd directories must already exist as root-owned, non-symlink directories. The role will not
      create or chmod shared host directories.

- name: Clear stale host firewall transaction completion records
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ host_firewall_confirmation_path }}"
    - "{{ host_firewall_confirmation_request_path }}"
    - "{{ host_firewall_rollback_record_path }}"

- name: Read only the prior role-owned nftables table
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_nft_binary }}"
      - list
      - table
      - "{{ host_firewall_table_family }}"
      - "{{ host_firewall_table_name }}"
  register: host_firewall_runtime_before_result
  changed_when: false
  failed_when: host_firewall_runtime_before_result.rc not in [0, 1]

- name: Persist replayable role-owned table before-state
  ansible.builtin.copy:
    content: |-
      destroy table {{ host_firewall_table_family }} {{ host_firewall_table_name }}
      {% if host_firewall_runtime_before_result.rc == 0 %}
      {{ host_firewall_runtime_before_result.stdout }}
      {% endif %}
    dest: "{{ host_firewall_runtime_backup_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Read structured prior role-owned nftables table
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_nft_binary }}"
      - --json
      - list
      - table
      - "{{ host_firewall_table_family }}"
      - "{{ host_firewall_table_name }}"
  register: host_firewall_runtime_before_json_result
  changed_when: false
  failed_when: host_firewall_runtime_before_json_result.rc not in [0, 1]

- name: Canonicalize structured prior role-owned table
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_python_binary }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/files/canonicalize_nft_json.py') }}"
      - --family
      - "{{ host_firewall_table_family }}"
      - --table
      - "{{ host_firewall_table_name }}"
      - --stdin-base64
    stdin: "{{ host_firewall_runtime_before_json_result.stdout | b64encode }}"
    stdin_add_newline: false
  register: host_firewall_runtime_before_canonical_result
  changed_when: false
  when: host_firewall_runtime_before_json_result.rc == 0

- name: Require consistent role-owned runtime before-state reads
  ansible.builtin.assert:
    that:
      - host_firewall_runtime_before_result.rc == host_firewall_runtime_before_json_result.rc
      - >-
        host_firewall_runtime_before_json_result.rc == 1
        or host_firewall_runtime_before_canonical_result.rc == 0
    fail_msg: >-
      The role-owned table changed while its rollback snapshot was being captured; no transaction may proceed from
      an inconsistent before-state.

- name: Record whether the role-owned runtime table existed before apply
  ansible.builtin.copy:
    content: "{{ 'present' if host_firewall_runtime_before_result.rc == 0 else 'absent' }}\n"
    dest: "{{ host_firewall_runtime_backup_state_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Validate replayable role-owned table before-state
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_nft_binary }}"
      - --check
      - --file
      - "{{ host_firewall_runtime_backup_path }}"
  register: host_firewall_runtime_backup_check
  changed_when: false
  check_mode: false

- name: Inspect prior role-owned persistent include
  ansible.builtin.stat:
    path: "{{ host_firewall_persistent_include_path }}"
    follow: false
  register: host_firewall_persistent_before_stat
  changed_when: false

- name: Read prior role-owned persistent include
  ansible.builtin.slurp:
    src: "{{ host_firewall_persistent_include_path }}"
  register: host_firewall_persistent_before_content
  changed_when: false
  when: host_firewall_persistent_before_stat.stat.exists

- name: Save prior role-owned persistent include
  ansible.builtin.copy:
    content: "{{ host_firewall_persistent_before_content.content | b64decode }}"
    dest: "{{ host_firewall_persistent_backup_path }}"
    owner: root
    group: root
    mode: "0600"
  when: host_firewall_persistent_before_stat.stat.exists

- name: Validate prior role-owned persistent include
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_nft_binary }}"
      - --check
      - --file
      - "{{ host_firewall_persistent_backup_path }}"
  changed_when: false
  check_mode: false
  when: host_firewall_persistent_before_stat.stat.exists

- name: Remove stale persistent include backup when no prior include exists
  ansible.builtin.file:
    path: "{{ host_firewall_persistent_backup_path }}"
    state: absent
  when: not host_firewall_persistent_before_stat.stat.exists

- name: Record whether the role-owned persistent include existed before apply
  ansible.builtin.copy:
    content: "{{ 'present' if host_firewall_persistent_before_stat.stat.exists else 'absent' }}\n"
    dest: "{{ host_firewall_persistent_state_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Stage immutable host firewall candidate
  ansible.builtin.copy:
    content: "{{ host_firewall_candidate_content }}"
    dest: "{{ host_firewall_pending_config_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Read staged transaction assets for exact metadata hashes
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ host_firewall_runtime_backup_path }}"
    - "{{ host_firewall_runtime_backup_state_path }}"
    - "{{ host_firewall_persistent_state_path }}"
  register: host_firewall_staged_transaction_assets
  changed_when: false

- name: Record exact pending host firewall transaction metadata
  ansible.builtin.copy:
    content: >-
      {{
        {
          'schema': 'lit.host_firewall.transaction/v2',
          'target': host_firewall_expected_inventory_hostname,
          'action': 'apply',
          'change_id': host_firewall_change_id,
          'candidate_sha256': host_firewall_candidate_sha256,
          'approved_readback_sha256': host_firewall_approved_readback_sha256,
          'policy_fingerprint': host_firewall_policy_fingerprint,
          'mode': host_firewall_mode,
          'runtime_backup_sha256': (
            host_firewall_staged_transaction_assets.results[0].content | b64decode | hash('sha256')
          ),
          'runtime_backup_state_sha256': (
            host_firewall_staged_transaction_assets.results[1].content | b64decode | hash('sha256')
          ),
          'runtime_before_canonical_sha256': (
            host_firewall_runtime_before_canonical_result.stdout | hash('sha256')
            if host_firewall_runtime_before_json_result.rc == 0
            else 'absent'
          ),
          'persistent_state_sha256': (
            host_firewall_staged_transaction_assets.results[2].content | b64decode | hash('sha256')
          ),
          'persistent_backup_sha256': (
            host_firewall_persistent_before_content.content | b64decode | hash('sha256')
            if host_firewall_persistent_before_stat.stat.exists
            else 'absent'
          )
        }
        | to_nice_json
      }}
    dest: "{{ host_firewall_pending_metadata_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Snapshot exact pending metadata for locked transaction programs
  ansible.builtin.slurp:
    src: "{{ host_firewall_pending_metadata_path }}"
  register: host_firewall_pending_metadata_snapshot
  changed_when: false

- name: Bind locked transaction programs to staged asset hashes
  ansible.builtin.set_fact:
    host_firewall_pending_metadata_sha256: >-
      {{ host_firewall_pending_metadata_snapshot.content | b64decode | hash('sha256') }}
    host_firewall_runtime_backup_sha256: >-
      {{ host_firewall_staged_transaction_assets.results[0].content | b64decode | hash('sha256') }}
    host_firewall_runtime_backup_state_sha256: >-
      {{ host_firewall_staged_transaction_assets.results[1].content | b64decode | hash('sha256') }}
    host_firewall_persistent_state_sha256: >-
      {{ host_firewall_staged_transaction_assets.results[2].content | b64decode | hash('sha256') }}
    host_firewall_persistent_backup_sha256: >-
      {{
        host_firewall_persistent_before_content.content | b64decode | hash('sha256')
        if host_firewall_persistent_before_stat.stat.exists
        else 'absent'
      }}

- name: Install host firewall transaction programs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0750"
  loop:
    - src: apply.sh.j2
      dest: "{{ host_firewall_apply_script_path }}"
    - src: rollback.sh.j2
      dest: "{{ host_firewall_rollback_script_path }}"
    - src: confirm.sh.j2
      dest: "{{ host_firewall_confirmation_script_path }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Install canonical nftables JSON verifier
  ansible.builtin.copy:
    src: canonicalize_nft_json.py
    dest: "{{ host_firewall_canonicalizer_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Validate host firewall transaction program syntax
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_bash_binary }}"
      - -n
      - "{{ item }}"
  loop:
    - "{{ host_firewall_apply_script_path }}"
    - "{{ host_firewall_rollback_script_path }}"
    - "{{ host_firewall_confirmation_script_path }}"
  changed_when: false

- name: Install host firewall systemd transaction units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ host_firewall_systemd_unit_directory }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: rollback.service.j2
      dest: "{{ host_firewall_rollback_service_name }}"
    - src: rollback.timer.j2
      dest: "{{ host_firewall_rollback_timer_name }}"
    - src: confirm.service.j2
      dest: "{{ host_firewall_confirmation_service_name }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Reload systemd after installing firewall transaction units
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_systemctl_binary }}"
      - daemon-reload
  changed_when: true

- name: Apply and validate host firewall under rollback protection
  block:
    - name: Execute locked role-owned firewall apply program
      ansible.builtin.command:
        argv:
          - "{{ host_firewall_apply_script_path }}"
      changed_when: true

    - name: Reset remote control connection after firewall replacement
      ansible.builtin.include_tasks: reset_connection.yml
      when: ansible_connection | default('ssh') != 'local'

    - name: Wait for the protected control connection to return
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        sleep: 2
        timeout: 45
      when: ansible_connection | default('ssh') != 'local'

    - name: Read back applied host firewall table
      ansible.builtin.include_tasks: readback.yml

    - name: Persist canonical host firewall after-state evidence
      ansible.builtin.copy:
        content: "{{ host_firewall_readback_canonical_json }}\n"
        dest: "{{ host_firewall_runtime_after_path }}"
        owner: root
        group: root
        mode: "0600"

  rescue:
    - name: Request immediate locked host firewall rollback after apply failure
      ansible.builtin.command:
        argv:
          - "{{ host_firewall_systemctl_binary }}"
          - start
          - "{{ host_firewall_rollback_service_name }}"
      register: host_firewall_apply_rescue_result
      changed_when: true
      failed_when: false

    - name: Stop after failed host firewall apply and rollback request
      ansible.builtin.fail:
        msg: >-
          Host firewall apply or structured readback failed. Immediate rollback was requested with return code
          {{ host_firewall_apply_rescue_result.rc | default('unavailable') }}; the armed timer remains the fallback.

- name: Report pending host firewall confirmation
  ansible.builtin.debug:
    msg: >-
      Candidate {{ host_firewall_candidate_sha256 }} is active but not persistent. The rollback watchdog remains armed
      until a separately signed and evidenced confirm action succeeds.
