---
- name: Execute one locked rollback-protected host firewall apply transaction
  ansible.builtin.command:
    argv: "{{ host_firewall_transaction_program_argv + ['apply'] }}"
    stdin: "{{ host_firewall_transaction_request | to_json | b64encode }}"
    stdin_add_newline: false
  register: host_firewall_apply_command
  changed_when: true

- name: Parse locked host firewall apply result
  ansible.builtin.set_fact:
    host_firewall_apply_result: "{{ host_firewall_apply_command.stdout | from_json }}"

- name: Require exact pending-confirmation evidence
  ansible.builtin.assert:
    that:
      - >-
        host_firewall_apply_result.keys() | list | sort
        == ['metadata_sha256', 'schema', 'status', 'transaction_id', 'transaction_path']
      - host_firewall_apply_result.schema == 'lit.host_firewall.apply-result/v3'
      - host_firewall_apply_result.status == 'pending-confirmation'
      - host_firewall_apply_result.transaction_id is match('^[a-f0-9]{32}\\Z')
      - host_firewall_apply_result.metadata_sha256 is match('^[a-f0-9]{64}\\Z')
      - >-
        host_firewall_apply_result.transaction_path
        == host_firewall_transactions_directory + '/' + host_firewall_apply_result.transaction_id
    fail_msg: "The locked apply routine did not return exact pending transaction evidence."

- name: Reset protected remote control connection after firewall apply
  ansible.builtin.include_tasks: reset_connection.yml
  when: ansible_connection | default('ssh') != 'local'

- name: Wait for protected control connection after firewall apply
  ansible.builtin.wait_for_connection:
    connect_timeout: 10
    sleep: 2
    timeout: 45
  when: ansible_connection | default('ssh') != 'local'
