---
- name: Require an independently approved canonical readback digest
  ansible.builtin.assert:
    that:
      - host_firewall_approved_readback_sha256 is match('^[a-f0-9]{64}\Z')
    fail_msg: >-
      Structured readback cannot be accepted without the canonical JSON SHA-256 from the independently approved
      policy artifact.

- name: Read back the role-owned nftables table as structured JSON
  ansible.builtin.command:
    argv:
      - "{{ host_firewall_nft_binary }}"
      - --json
      - list
      - table
      - "{{ host_firewall_table_family }}"
      - "{{ host_firewall_table_name }}"
  register: host_firewall_readback_result
  changed_when: false
  check_mode: false

- name: Canonicalize structured host firewall readback
  ansible.builtin.command:
    argv: >-
      {{
        [
          host_firewall_python_binary,
          '-c',
          lookup('ansible.builtin.file', role_path + '/files/firewall_transaction.py')
        ]
        + host_firewall_transaction_program_argv[1:]
        + ['canonicalize', '--stdin-base64']
      }}
    stdin: "{{ host_firewall_readback_result.stdout | b64encode }}"
    stdin_add_newline: false
  register: host_firewall_readback_canonical_result
  changed_when: false
  check_mode: false

- name: Validate canonical host firewall policy against approved policy
  ansible.builtin.assert:
    that:
      - not host_firewall_readback_result.skipped | default(false)
      - not host_firewall_readback_canonical_result.skipped | default(false)
      - host_firewall_readback_result.rc == 0
      - host_firewall_readback_canonical_result.rc == 0
      - >-
        host_firewall_readback_canonical_result.stdout | hash('sha256')
        == host_firewall_approved_readback_sha256
    fail_msg: >-
      Canonical nftables JSON differs from the independently approved policy. Text comments or partial fragments do
      not satisfy this check.

- name: Publish canonical host firewall readback facts
  ansible.builtin.set_fact:
    host_firewall_readback_canonical_json: "{{ host_firewall_readback_canonical_result.stdout }}"
    host_firewall_readback_sha256: "{{ host_firewall_readback_canonical_result.stdout | hash('sha256') }}"
