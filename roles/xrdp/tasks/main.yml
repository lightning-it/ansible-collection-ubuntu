---
- name: Validate XRDP inputs before host changes
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Skip when disabled
  ansible.builtin.meta: end_host
  when: not (xrdp_enabled | bool)

- name: Gather installed packages (XRDP precheck)
  ansible.builtin.package_facts:
    manager: auto

- name: Set XRDP installed flag
  ansible.builtin.set_fact:
    _xrdp_installed: "{{ 'xrdp' in ansible_facts.packages }}"
  changed_when: false

- name: Precheck - verify XRDP packages are available in enabled repos
  ansible.builtin.command: "apt-cache policy {{ xrdp_packages | join(' ') }}"
  register: _xrdp_repo_check
  changed_when: false
  failed_when: false
  when: not _xrdp_installed

- name: Fail with guidance when XRDP packages are not available
  ansible.builtin.fail:
    msg: |
      XRDP packages are not available in currently enabled repositories.
      This role does NOT enable repos.

      Fix:
      - Enable the required apt repository or internal mirror using role: lit.ubuntu.repos
        (or your repo policy of choice)
      - Then rerun this role.

      Debug:
      - apt-cache policy xrdp xorgxrdp
  when:
    - xrdp_fail_if_unavailable | bool
    - not _xrdp_installed
    - _xrdp_repo_check is defined
    - _xrdp_repo_check.rc != 0

- name: Install XRDP packages
  ansible.builtin.apt:
    name: "{{ xrdp_packages }}"
    state: present
    policy_rc_d: 101
  no_log: "{{ xrdp_no_log }}"
  notify: Restart xrdp

- name: Install optional XRDP packages (best-effort)
  ansible.builtin.apt:
    name: "{{ xrdp_optional_packages }}"
    state: present
    policy_rc_d: 101
  failed_when: false
  no_log: "{{ xrdp_no_log }}"
  notify: Restart xrdp
  when: (xrdp_optional_packages | default([]) | length) > 0

- name: Ensure desktop users can traverse the public XRDP configuration directory
  ansible.builtin.file:
    path: /etc/xrdp
    state: directory
    follow: false
    owner: root
    group: root
    mode: "0755"

- name: Determine effective desktop mode
  ansible.builtin.set_fact:
    _xrdp_desktop_effective: >-
      {{
        (xrdp_desktop | default('auto'))
        if (xrdp_desktop | default('auto')) != 'auto'
        else 'gnome'
      }}
  changed_when: false

- name: Install GNOME desktop packages (optional)
  ansible.builtin.package:
    name:
      - ubuntu-desktop-minimal
    state: present
  when:
    - xrdp_install_desktop | bool
    - _xrdp_desktop_effective == 'gnome'

- name: Install XFCE desktop packages (optional)
  ansible.builtin.package:
    name:
      - xfce4
      - xfce4-goodies
    state: present
  when:
    - xrdp_install_desktop | bool
    - _xrdp_desktop_effective == 'xfce'

- name: Ensure provisioned GNOME user configuration directories
  become: true
  become_user: "{{ item }}"
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[item][4] }}/.config"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ xrdp_gnome_provisioned_users }}"
  when: _xrdp_desktop_effective == 'gnome'

- name: Mark declared GNOME users as configured by automation
  become: true
  become_user: "{{ item }}"
  ansible.builtin.copy:
    dest: "{{ ansible_facts.getent_passwd[item][4] }}/.config/gnome-initial-setup-done"
    content: "yes\n"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: "{{ xrdp_gnome_provisioned_users }}"
  when: _xrdp_desktop_effective == 'gnome'

- name: Declare OS release upgrade prompting without altering package updates
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: '^Prompt='
    line: "Prompt={{ xrdp_release_upgrade_prompt }}"
  when: xrdp_release_upgrade_prompt | length > 0

- name: Check TLS certificate exists
  ansible.builtin.stat:
    path: "{{ xrdp_tls_cert_path }}"
  register: _xrdp_cert
  when: xrdp_tls_enable | bool

- name: Generate self-signed cert/key for XRDP (when missing)
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -keyout
      - "{{ xrdp_tls_key_path }}"
      - -out
      - "{{ xrdp_tls_cert_path }}"
      - -days
      - "{{ xrdp_tls_days | int | string }}"
      - -subj
      - "{{ xrdp_tls_subject }}"
    creates: "{{ xrdp_tls_cert_path }}"
  when:
    - xrdp_tls_enable | bool
    - xrdp_tls_generate_self_signed | bool
    - _xrdp_cert is defined
    - not _xrdp_cert.stat.exists
  notify: Restart xrdp

- name: Inspect materialized XRDP TLS certificate without following links
  ansible.builtin.stat:
    path: "{{ xrdp_tls_cert_path }}"
    follow: false
  register: _xrdp_cert
  when: xrdp_tls_enable | bool

- name: Require a regular XRDP certificate before daemon access changes
  ansible.builtin.assert:
    that:
      - _xrdp_cert.stat.exists
      - not (_xrdp_cert.stat.islnk | default(false))
      - _xrdp_cert.stat.isreg | default(false)
    quiet: true
  when:
    - xrdp_tls_enable | bool
    - not ansible_check_mode or _xrdp_cert.stat.exists

- name: Inspect materialized XRDP TLS key without following links
  ansible.builtin.stat:
    path: "{{ xrdp_tls_key_path }}"
    follow: false
  register: _xrdp_key
  when: xrdp_tls_enable | bool

- name: Require a regular materialized XRDP TLS key before daemon access changes
  ansible.builtin.assert:
    that:
      - _xrdp_key.stat.exists
      - not (_xrdp_key.stat.islnk | default(false))
      - _xrdp_key.stat.isreg | default(false)
    quiet: true
  when:
    - xrdp_tls_enable | bool
    - not ansible_check_mode or _xrdp_key.stat.exists

- name: Validate materialized XRDP TLS identity before daemon access changes
  ansible.builtin.include_tasks: validate_tls_pair.yml
  when:
    - xrdp_tls_enable | bool
    - not ansible_check_mode or (_xrdp_cert.stat.exists and _xrdp_key.stat.exists)

- name: Require the TLS key group installed by packages or the operator
  ansible.builtin.getent:
    database: group
    key: "{{ xrdp_tls_key_group }}"
  when:
    - xrdp_tls_enable | bool
    - xrdp_tls_key_path | length > 0
    - not ansible_check_mode or _xrdp_installed | bool

- name: Give the installed XRDP daemon access to its declared key group
  ansible.builtin.user:
    name: xrdp
    groups: "{{ xrdp_tls_key_group }}"
    append: true
  when:
    - xrdp_tls_enable | bool
    - xrdp_tls_key_path | length > 0
    - not ansible_check_mode or _xrdp_installed | bool
  notify: Restart xrdp

- name: Ensure permissions on XRDP TLS key
  ansible.builtin.file:
    path: "{{ xrdp_tls_key_path }}"
    follow: false
    owner: root
    group: "{{ xrdp_tls_key_group }}"
    mode: "{{ xrdp_tls_key_mode }}"
  when:
    - xrdp_tls_enable | bool
    - xrdp_tls_key_path | length > 0
    - not ansible_check_mode or (_xrdp_installed | bool and (_xrdp_key.stat.exists | default(false)))
  notify: Restart xrdp

- name: Ensure the XRDP daemon can read its validated certificate
  ansible.builtin.file:
    path: "{{ xrdp_tls_cert_path }}"
    follow: false
    owner: root
    group: "{{ xrdp_tls_key_group }}"
    mode: "0640"
  when:
    - xrdp_tls_enable | bool
    - not ansible_check_mode or (_xrdp_installed | bool and (_xrdp_cert.stat.exists | default(false)))
    - >-
      (_xrdp_cert.stat.mode | default('0000'))[-1] not in ['4', '5', '6', '7']
      and not (
        (_xrdp_cert.stat.mode | default('0000'))[-2] in ['4', '5', '6', '7']
        and _xrdp_cert.stat.gid | default(-1) == ansible_facts.getent_group[xrdp_tls_key_group][1] | int
      )
  notify: Restart xrdp

- name: Configure xrdp.ini
  ansible.builtin.template:
    src: xrdp.ini.j2
    dest: /etc/xrdp/xrdp.ini
    owner: root
    group: root
    mode: "0644"
  notify: Restart xrdp

- name: Configure startwm.sh (session startup)
  ansible.builtin.template:
    src: startwm.sh.j2
    dest: /etc/xrdp/startwm.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart xrdp

- name: Ensure firewalld is installed (when managing firewall)
  ansible.builtin.package:
    name: firewalld
    state: present
  when: xrdp_firewalld_manage | bool

- name: Ensure firewalld is enabled and running (when managing firewall)
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: xrdp_firewalld_manage | bool

- name: Open RDP port in firewalld
  ansible.posix.firewalld:
    zone: "{{ xrdp_firewalld_zone }}"
    port: "{{ xrdp_listen_port }}/tcp"
    permanent: true
    immediate: true
    state: "{{ xrdp_firewalld_state }}"
  when: xrdp_firewalld_manage | bool

- name: Enable and start xrdp service
  ansible.builtin.service:
    name: xrdp
    state: started
    enabled: true

- name: Enable and start xrdp-sesman service (if present)
  ansible.builtin.service:
    name: xrdp-sesman
    state: started
    enabled: true
