---
- name: Validate XRDP desktop and listener inputs
  ansible.builtin.assert:
    that:
      - xrdp_desktop in ['auto', 'gnome', 'xfce', 'custom']
      - xrdp_listen_address is string
      - xrdp_listen_address is match('^(0|[1-9][0-9]{0,2})([.](0|[1-9][0-9]{0,2})){3}\\Z')
      - xrdp_listen_address.split('.') | map('int') | max <= 255
      - xrdp_listen_port is integer and xrdp_listen_port >= 1 and xrdp_listen_port <= 65535
      - xrdp_gnome_private_dbus_session is boolean
      - xrdp_gnome_session is string and xrdp_gnome_session is match('^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$')
      - xrdp_tls_key_group is string and xrdp_tls_key_group is match('^[a-z_][a-z0-9_-]{0,31}$')
      - xrdp_tls_key_mode is string and xrdp_tls_key_mode in ['0440', '0640']
      - xrdp_tls_key_group in ['ssl-cert', 'xrdp']
      - xrdp_tls_enable is boolean
      - xrdp_tls_generate_self_signed is boolean
      - not (xrdp_tls_enable and xrdp_tls_generate_self_signed) or (xrdp_tls_days is integer and xrdp_tls_days > 0)
      - xrdp_release_upgrade_prompt in ['', 'never', 'normal', 'lts']
      - xrdp_gnome_provisioned_users is sequence and xrdp_gnome_provisioned_users is not string
      - xrdp_gnome_provisioned_users | unique | length == xrdp_gnome_provisioned_users | length
    quiet: true

- name: Require explicit existing personal GNOME user names
  ansible.builtin.assert:
    that:
      - item is string and item is match('^[a-z][a-z0-9_-]{0,31}$')
    quiet: true
  loop: "{{ xrdp_gnome_provisioned_users }}"

- name: Discover existing personal GNOME accounts before changes
  ansible.builtin.getent:
    database: passwd
  when: xrdp_gnome_provisioned_users | length > 0
  no_log: true

- name: Discover existing personal GNOME groups before changes
  ansible.builtin.getent:
    database: group
  when: xrdp_gnome_provisioned_users | length > 0 or xrdp_tls_enable | bool
  no_log: true

- name: Require a known package-owned or existing custom TLS key group before changes
  ansible.builtin.assert:
    that:
      - xrdp_tls_key_group in ['ssl-cert', 'xrdp']
    quiet: true
  when: xrdp_tls_enable | bool

- name: Require every declared existing account and matching group
  ansible.builtin.assert:
    that:
      - item in ansible_facts.getent_passwd
      - item in ansible_facts.getent_group
      - >-
        ansible_facts.getent_passwd[item][2] == ansible_facts.getent_group[item][1]
        or item in ansible_facts.getent_group[item][2].split(',')
    quiet: true
  loop: "{{ xrdp_gnome_provisioned_users }}"

- name: Validate discovered home directories
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[item][4] is match('^/(home|srv/home)/[a-z][a-z0-9_-]{0,31}$')
    quiet: true
  loop: "{{ xrdp_gnome_provisioned_users }}"

- name: Inspect personal home directories without following links
  ansible.builtin.stat:
    path: "{{ ansible_facts.getent_passwd[item][4] }}"
    follow: false
  loop: "{{ xrdp_gnome_provisioned_users }}"
  register: _xrdp_home_preflight

- name: Refuse linked or missing personal home directories
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - not (item.stat.islnk | default(false))
      - item.stat.isdir | default(false)
      - item.stat.uid == ansible_facts.getent_passwd[item.item][1] | int
      - item.stat.gid == ansible_facts.getent_group[item.item][1] | int
      - item.stat.mode[-3] | int in [3, 7]
      - item.stat.mode[-2] | int in [0, 1, 4, 5]
      - item.stat.mode[-1] | int in [0, 1, 4, 5]
    quiet: true
  loop: "{{ _xrdp_home_preflight.results }}"

- name: Verify personal home traversal as the declared account before changes
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - -x
      - "{{ ansible_facts.getent_passwd[item][4] }}"
  become: true
  become_user: "{{ item }}"
  loop: "{{ xrdp_gnome_provisioned_users }}"
  check_mode: false
  changed_when: false

- name: Verify personal home write access as the declared account before changes
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - -w
      - "{{ ansible_facts.getent_passwd[item][4] }}"
  become: true
  become_user: "{{ item }}"
  loop: "{{ xrdp_gnome_provisioned_users }}"
  check_mode: false
  changed_when: false

- name: Inspect personal configuration directories without following links
  ansible.builtin.stat:
    path: "{{ ansible_facts.getent_passwd[item][4] }}/.config"
    follow: false
  loop: "{{ xrdp_gnome_provisioned_users }}"
  register: _xrdp_config_preflight

- name: Refuse linked or non-directory personal configuration paths
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not item.stat.exists or item.stat.uid == ansible_facts.getent_passwd[item.item][1] | int
      - not item.stat.exists or item.stat.gid == ansible_facts.getent_group[item.item][1] | int
      - not item.stat.exists or item.stat.mode[-2] | int in [0, 1, 4, 5]
      - not item.stat.exists or item.stat.mode[-1] | int in [0, 1, 4, 5]
    quiet: true
  loop: "{{ _xrdp_config_preflight.results }}"

- name: Require distinct absolute TLS paths without INI control characters
  ansible.builtin.assert:
    that:
      - xrdp_tls_cert_path is string and xrdp_tls_cert_path is match('^/[^\x00-\x1f\x7f]+\\Z')
      - xrdp_tls_key_path is string and xrdp_tls_key_path is match('^/[^\x00-\x1f\x7f]+\\Z')
      - xrdp_tls_cert_path != xrdp_tls_key_path
      - "'.' not in xrdp_tls_cert_path.split('/') and '..' not in xrdp_tls_cert_path.split('/')"
      - "'.' not in xrdp_tls_key_path.split('/') and '..' not in xrdp_tls_key_path.split('/')"
      - "'//' not in xrdp_tls_cert_path and '//' not in xrdp_tls_key_path"
    quiet: true
  when: xrdp_tls_enable | bool

- name: Validate every TLS ancestor before package or file mutations
  ansible.builtin.include_tasks: tls_ancestor_preflight.yml
  loop: "{{ [xrdp_tls_cert_path, xrdp_tls_key_path] | unique }}"
  loop_control:
    loop_var: xrdp_tls_output_path
  when: xrdp_tls_enable | bool

- name: Inspect existing XRDP TLS output paths before any changes
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ [xrdp_tls_cert_path, xrdp_tls_key_path] | unique }}"
  register: _xrdp_tls_path_preflight
  when: xrdp_tls_enable | bool

- name: Refuse linked or non-regular XRDP TLS output paths before any changes
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or (item.stat.isreg | default(false))
      - xrdp_tls_generate_self_signed | bool or item.stat.exists
    quiet: true
  loop: "{{ _xrdp_tls_path_preflight.results | default([]) }}"
  when: xrdp_tls_enable | bool

- name: Inspect the optional release upgrade configuration before changes
  ansible.builtin.stat:
    path: /etc/update-manager/release-upgrades
    follow: false
  register: _xrdp_release_upgrade_preflight
  when: xrdp_release_upgrade_prompt | length > 0

- name: Require an existing regular release upgrade configuration
  ansible.builtin.assert:
    that:
      - _xrdp_release_upgrade_preflight.stat.exists
      - _xrdp_release_upgrade_preflight.stat.isreg | default(false)
      - not (_xrdp_release_upgrade_preflight.stat.islnk | default(false))
    quiet: true
  when: xrdp_release_upgrade_prompt | length > 0

- name: Require both TLS outputs present or both absent before self-signed generation
  ansible.builtin.assert:
    that:
      - _xrdp_tls_path_preflight.results[0].stat.exists == _xrdp_tls_path_preflight.results[1].stat.exists
    quiet: true
  when:
    - xrdp_tls_enable | bool
    - xrdp_tls_generate_self_signed | bool

- name: Validate an existing XRDP TLS pair before any package or permission changes
  ansible.builtin.include_tasks: validate_tls_pair.yml
  when:
    - xrdp_tls_enable | bool
    - _xrdp_tls_path_preflight.results[0].stat.exists
    - _xrdp_tls_path_preflight.results[1].stat.exists
