---
incus_enabled: true

incus_packages:
  - bridge-utils
  - incus
  - incus-client
  - qemu-system-x86
  - qemu-utils
  - uidmap

incus_update_apt_cache: true
incus_initialize: true
incus_preseed: {}

incus_manage_root_idmap: true
incus_root_idmap_owner: root
incus_root_idmap_start: 1000000
incus_root_idmap_count: 1000000000
incus_root_subuid_path: /etc/subuid
incus_root_subgid_path: /etc/subgid

incus_projects: []
incus_profiles: []

incus_services:
  - incus.socket
  - incus-startup.service

incus_users: []
incus_user_groups:
  - incus-admin
  - kvm
