---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Normalize users_accounts to a list
  ansible.builtin.set_fact:
    users_accounts_base_effective: >-
      {%- set ua = users_accounts | default([]) -%}
      {%- if ua is mapping -%}
        {{ ua | dict2items | map(attribute='value') | list }}
      {%- elif ua is sequence and (ua is not string) -%}
        {{ ua }}
      {%- else -%}
        []
      {%- endif -%}
  changed_when: false

- name: Normalize users_accounts_extra to a list
  ansible.builtin.set_fact:
    users_accounts_extra_effective: >-
      {%- set ua = users_accounts_extra | default([]) -%}
      {%- if ua is mapping -%}
        {{ ua | dict2items | map(attribute='value') | list }}
      {%- elif ua is sequence and (ua is not string) -%}
        {{ ua }}
      {%- else -%}
        []
      {%- endif -%}
  changed_when: false

- name: Normalize users_accounts_global to a list
  ansible.builtin.set_fact:
    users_accounts_global_effective: >-
      {%- set ua = users_accounts_global | default([]) -%}
      {%- if ua is mapping -%}
        {{ ua | dict2items | map(attribute='value') | list }}
      {%- elif ua is sequence and (ua is not string) -%}
        {{ ua }}
      {%- else -%}
        []
      {%- endif -%}
  changed_when: false

- name: Merge user definitions with global policy taking precedence
  ansible.builtin.set_fact:
    users_accounts_effective: >-
      {%- set merged = {} -%}
      {%- set definitions =
        (users_accounts_base_effective | default([]))
        + (users_accounts_extra_effective | default([]))
        + (users_accounts_global_effective | default([]))
      -%}
      {%- for account in definitions -%}
        {%- set effective = merged.get(account.name, {}) | combine(account, recursive=True) -%}
        {%- set _ = merged.update({account.name: effective}) -%}
      {%- endfor -%}
      {{ merged.values() | list }}
  changed_when: false

- name: Build group list from user definitions
  ansible.builtin.set_fact:
    users_groups_all: >-
      {{
        users_accounts_effective
        | map(attribute='groups', default=[])
        | sum(start=[])
        | map('string')
        | list
      }}
  when: users_manage_groups | bool and users_accounts_effective | length > 0
  changed_when: false

- name: Ensure referenced groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ users_groups_all | default([]) | unique }}"
  when:
    - users_manage_groups | bool
    - users_accounts_effective | length > 0

- name: Manage users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    uid: "{{ item.uid | default(omit) }}"
    group: "{{ item.gid | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    append: >-
      {{
        item.groups_append
        | default((item.groups | default([]) | length) > 0)
        | bool
      }}
    shell: "{{ item.shell | default(omit) }}"
    home: "{{ item.home | default(omit) }}"
    create_home: "{{ item.create_home | default(omit) }}"
    password: "{{ item.password | default(omit) }}"
    update_password: "{{ item.update_password | default(omit) }}"
    password_lock: "{{ item.password_lock | default(omit) }}"
    remove: "{{ item.remove | default(false) }}"
  loop: "{{ users_accounts_effective }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build list of users with SSH keys in present state
  ansible.builtin.set_fact:
    users_with_ssh_keys: >-
      {{
        (
          users_accounts_effective
          | select('mapping')
          | selectattr('ssh_keys', 'defined')
          | rejectattr('ssh_keys', 'equalto', [])
          | selectattr('state', 'undefined')
          | list
        )
        +
        (
          users_accounts_effective
          | select('mapping')
          | selectattr('ssh_keys', 'defined')
          | rejectattr('ssh_keys', 'equalto', [])
          | selectattr('state', 'defined')
          | selectattr('state', 'equalto', 'present')
          | list
        )
      }}
  changed_when: false

- name: Manage authorized keys for present users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.ssh_keys | join('\n') }}"
    exclusive: "{{ item.ssh_keys_exclusive | default(false) | bool }}"
    manage_dir: true
  loop: "{{ users_with_ssh_keys | default([]) }}"
  when:
    - users_with_ssh_keys is defined
    - users_with_ssh_keys | length > 0
  loop_control:
    label: "{{ item.name }}"

- name: Build list of users with passwordless sudo in present state
  ansible.builtin.set_fact:
    users_with_passwordless_sudo: >-
      {{
        (
          users_accounts_effective
          | select('mapping')
          | selectattr('passwordless_sudo', 'defined')
          | selectattr('passwordless_sudo', 'equalto', true)
          | selectattr('state', 'undefined')
          | list
        )
        +
        (
          users_accounts_effective
          | select('mapping')
          | selectattr('passwordless_sudo', 'defined')
          | selectattr('passwordless_sudo', 'equalto', true)
          | selectattr('state', 'defined')
          | selectattr('state', 'equalto', 'present')
          | list
        )
      }}
  changed_when: false

- name: Ensure passwordless sudo for configured users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.sudoers_name | default(item.name) }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: visudo -cf %s
  loop: "{{ users_with_passwordless_sudo | default([]) }}"
  when:
    - users_with_passwordless_sudo is defined
    - users_with_passwordless_sudo | length > 0
  loop_control:
    label: "{{ item.name }}"

- name: Build list of users with passwordless sudo explicitly disabled
  ansible.builtin.set_fact:
    users_without_passwordless_sudo: >-
      {{
        users_accounts_effective
        | select('mapping')
        | selectattr('sudoers_name', 'defined')
        | selectattr('passwordless_sudo', 'defined')
        | selectattr('passwordless_sudo', 'equalto', false)
        | list
      }}
  changed_when: false

- name: Remove explicitly disabled passwordless sudo files
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.sudoers_name }}"
    state: absent
  loop: "{{ users_without_passwordless_sudo | default([]) }}"
  when:
    - users_without_passwordless_sudo is defined
    - users_without_passwordless_sudo | length > 0
  loop_control:
    label: "{{ item.name }}"
