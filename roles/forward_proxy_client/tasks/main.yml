---
- name: Validate Ubuntu forward proxy client configuration
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Acquire the bounded per-host proxy-client transition lock
  ansible.builtin.command:
    argv:
      - /usr/bin/mkdir
      - --mode=0700
      - "{{ forward_proxy_client_lock_path }}"
  register: forward_proxy_client_lock_acquisition
  changed_when: forward_proxy_client_lock_acquisition.rc == 0
  failed_when: false
  retries: "{{ forward_proxy_client_lock_timeout }}"
  delay: 1
  until: forward_proxy_client_lock_acquisition.rc == 0
  when: not ansible_check_mode

- name: Apply the complete proxy-client transition under one host lock
  block:
    - name: Inspect, transition, render, activate, and finalize proxy-client state
      ansible.builtin.include_tasks: transition.yml
  always:
    - name: Release the per-host proxy-client transition lock
      ansible.builtin.file:
        path: "{{ forward_proxy_client_lock_path }}"
        state: absent
      when:
        - not ansible_check_mode
        - forward_proxy_client_lock_acquisition.rc | default(1) == 0
