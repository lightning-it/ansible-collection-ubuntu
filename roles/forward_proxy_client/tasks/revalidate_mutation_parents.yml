---
- name: Reinspect every trusted proxy-client parent at the mutation boundary
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ forward_proxy_client_trusted_parent_paths }}"
  register: forward_proxy_client_mutation_parent_stats

- name: Require every trusted proxy-client parent at the mutation boundary
  ansible.builtin.assert:
    that:
      - >-
        (
          item.stat.exists
          and item.stat.isdir | default(false)
          and not item.stat.islnk | default(false)
          and (
            item.stat.mode is match('^0[0-7][0145][0145]\Z')
            or (
              item.item in ['/tmp', forward_proxy_client_render_root]
              and item.stat.mode == '1777'
              and item.stat.uid == 0
              and item.stat.gid == 0
            )
          )
          and (
            item.stat.uid == 0
            or item.stat.pw_name | default('') == forward_proxy_client_file_owner | string
            or item.stat.uid | string == forward_proxy_client_file_owner | string
          )
          and (
            item.stat.gid == 0
            or item.stat.gr_name | default('') == forward_proxy_client_file_group | string
            or item.stat.gid | string == forward_proxy_client_file_group | string
          )
        )
        or (
          ansible_check_mode
          and item.item in forward_proxy_client_planned_directories_internal
        )
    fail_msg: >-
      A trusted proxy-client parent changed after validation. Stop immediately
      before the filesystem mutation.
  loop: "{{ forward_proxy_client_mutation_parent_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
