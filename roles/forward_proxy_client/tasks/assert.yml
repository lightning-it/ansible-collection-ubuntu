---
- name: Validate Ubuntu forward proxy client interface
  ansible.builtin.assert:
    that:
      - forward_proxy_client_enabled is boolean
      - forward_proxy_client_manage_systemd is boolean
      - forward_proxy_client_restart_services is sequence
      - forward_proxy_client_restart_services is not string
      - >-
        forward_proxy_client_restart_services | unique | list | length
        == forward_proxy_client_restart_services | length
      - forward_proxy_client_restart_now is boolean
      - forward_proxy_client_file_owner is match('^(?:[a-z_][a-z0-9_-]{0,31}|[0-9]{1,10})$')
      - forward_proxy_client_file_group is match('^(?:[a-z_][a-z0-9_-]{0,31}|[0-9]{1,10})$')
      - >-
        forward_proxy_client_file_owner in ['root', '0']
        or (
          not forward_proxy_client_manage_systemd
          and (
            (_forward_proxy_client_all_managed_paths + [forward_proxy_client_state_marker_path])
            | reject('match', '^/tmp/') | list | length == 0
          )
        )
      - >-
        forward_proxy_client_file_group in ['root', '0']
        or (
          not forward_proxy_client_manage_systemd
          and (
            (_forward_proxy_client_all_managed_paths + [forward_proxy_client_state_marker_path])
            | reject('match', '^/tmp/') | list | length == 0
          )
        )
      - forward_proxy_client_systemd_scope == 'system'
      - forward_proxy_client_proxy_port | int >= 1024
      - forward_proxy_client_proxy_port | int <= 65535
      - >-
        forward_proxy_client_proxy_url
        == 'http://127.0.0.1:' ~ (forward_proxy_client_proxy_port | string)
      - >-
        forward_proxy_client_container_url
        == 'http://host.containers.internal:' ~ (forward_proxy_client_proxy_port | string)
      - forward_proxy_client_listen_addresses is sequence
      - forward_proxy_client_listen_addresses is not string
      - "'127.0.0.1' in forward_proxy_client_listen_addresses"
      - forward_proxy_client_allowed_clients is sequence
      - forward_proxy_client_allowed_clients is not string
      - "'127.0.0.1/32' in forward_proxy_client_allowed_clients"
      - forward_proxy_client_container_enabled is boolean
      - >-
        not forward_proxy_client_container_enabled
        or forward_proxy_client_listen_addresses | difference(['127.0.0.1']) | length > 0
      - forward_proxy_client_no_proxy is sequence
      - forward_proxy_client_no_proxy is not string
      - forward_proxy_client_apt_direct_hosts is sequence
      - forward_proxy_client_apt_direct_hosts is not string
      - forward_proxy_client_upstream_enabled is boolean
      - forward_proxy_client_upstream_port | int >= 1
      - forward_proxy_client_upstream_port | int <= 65535
      - >-
        not forward_proxy_client_upstream_enabled
        or forward_proxy_client_upstream_host | length > 0
      - >-
        forward_proxy_client_apt_direct_hosts | unique | list | length
        == forward_proxy_client_apt_direct_hosts | length
      - >-
        forward_proxy_client_apt_direct_hosts | difference(forward_proxy_client_no_proxy) | length == 0
      - >-
        forward_proxy_client_apt_direct_hosts | difference(['localhost', '127.0.0.1']) | length == 0
    fail_msg: >-
      Ubuntu proxy-client inputs must point to the loopback service and define
      exact host and optional container integration boundaries.

- name: Validate opted-in service restarts
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_.@-]{1,128}$')
    fail_msg: "Opted-in proxy client services must use exact systemd unit names."
  loop: "{{ forward_proxy_client_restart_services }}"

- name: Validate Ubuntu forward proxy client networks
  ansible.builtin.assert:
    that:
      - >-
        item is match(
          '^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
          '(?:\\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}'
          '/(?:[1-9]|[12][0-9]|3[0-2])$'
        )
      - >-
        item == '127.0.0.1/32'
        or item is match(
          '^(?:10\.|192\.168\.|172\.(?:1[6-9]|2[0-9]|3[01])\.)'
        )
    fail_msg: >-
      Proxy clients must be exact loopback or RFC1918 CIDRs; globally routable
      client networks are forbidden.
  loop: "{{ forward_proxy_client_allowed_clients }}"

- name: Validate the Ubuntu proxy owner firewall boundary
  ansible.builtin.assert:
    that:
      - forward_proxy_client_firewall_egress is mapping
      - forward_proxy_client_firewall_egress.get('enabled', false) is boolean
      - forward_proxy_client_firewall_egress.get('enabled', false)
      - forward_proxy_client_firewall_egress.get('owner_username', '') == 'proxy'
      - >-
        forward_proxy_client_firewall_egress.get('mode', '')
        == ('upstream' if forward_proxy_client_upstream_enabled else 'direct')
      - >-
        forward_proxy_client_firewall_egress.get('ports', [])
        == (
          [forward_proxy_client_upstream_port]
          if forward_proxy_client_upstream_enabled
          else [80, 443]
        )
      - >-
        not forward_proxy_client_upstream_enabled
        or forward_proxy_client_firewall_egress.get('destinations_ipv4', []) | length > 0
    fail_msg: >-
      The Ubuntu host firewall must bind the exact proxy identity, direct or
      upstream mode, and destination ports used by the Squid container.
  when: forward_proxy_client_enabled | bool

- name: Require the client-container firewall contract
  ansible.builtin.assert:
    that:
      - forward_proxy_client_container_firewall_access is mapping
      - forward_proxy_client_container_firewall_interfaces is sequence
      - forward_proxy_client_container_firewall_interfaces is not string
    fail_msg: >-
      Container proxy propagation requires the live, inventory-pinned host
      firewall access contract and container interface list.
  when: forward_proxy_client_container_enabled | bool

- name: Validate the client-container firewall contract
  ansible.builtin.assert:
    that:
      - >-
        forward_proxy_client_container_firewall_access.keys() | list | sort
        == ['destination_ipv4', 'enabled', 'interfaces', 'port', 'sources_ipv4']
      - forward_proxy_client_container_firewall_access.enabled is boolean
      - forward_proxy_client_container_firewall_access.enabled
      - forward_proxy_client_container_firewall_access.port is integer
      - forward_proxy_client_container_firewall_access.port == forward_proxy_client_proxy_port
      - >-
        forward_proxy_client_container_firewall_access.destination_ipv4
        in forward_proxy_client_listen_addresses
      - >-
        not forward_proxy_client_container_firewall_access.destination_ipv4.startswith('127.')
      - forward_proxy_client_container_firewall_access.interfaces | length > 0
      - forward_proxy_client_container_firewall_access.sources_ipv4 | length > 0
      - >-
        forward_proxy_client_container_firewall_access.interfaces
        | difference(forward_proxy_client_container_firewall_interfaces) | length == 0
      - >-
        forward_proxy_client_container_firewall_access.sources_ipv4
        | difference(forward_proxy_client_allowed_clients) | length == 0
    fail_msg: >-
      Container propagation must use the exact listener, port, interfaces,
      and source CIDRs admitted by the Ubuntu host firewall.
  when: forward_proxy_client_container_enabled | bool

- name: Validate forward proxy client bypass entries
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9.:_-]+(?:/[0-9]{1,3})?$')
      - "',' not in item"
      - "'\n' not in item"
      - "'\r' not in item"
      - "'\"' not in item"
    fail_msg: "NO_PROXY entries must be individual host, domain, address, or CIDR tokens."
  loop: "{{ forward_proxy_client_no_proxy }}"

- name: Validate exact apt direct hosts
  ansible.builtin.assert:
    that:
      - item in ['localhost', '127.0.0.1']
    fail_msg: >-
      APT DIRECT exceptions are restricted to host-local loopback names and
      addresses; site-local exceptions need their own reviewed firewall grant.
  loop: "{{ forward_proxy_client_apt_direct_hosts }}"

- name: Validate managed forward proxy client paths
  ansible.builtin.assert:
    that:
      - item is match('^/[A-Za-z0-9_./-]+$')
      - item != '/'
      - "'..' not in item.split('/')"
      - "'//' not in item"
    fail_msg: "Managed forward proxy client paths must be exact absolute paths."
  loop:
    - "{{ forward_proxy_client_apt_config_path }}"
    - "{{ forward_proxy_client_profile_path }}"
    - "{{ forward_proxy_client_environment_path }}"
    - "{{ forward_proxy_client_systemd_environment_path }}"
    - "{{ forward_proxy_client_containers_config_path }}"
    - "{{ forward_proxy_client_state_marker_path }}"

- name: Require distinct managed forward proxy client paths
  ansible.builtin.assert:
    that:
      - >-
        (
          _forward_proxy_client_all_managed_paths
          + [forward_proxy_client_state_marker_path]
        ) | unique | list | length
        == (_forward_proxy_client_all_managed_paths | length) + 1
    fail_msg: "Every Ubuntu proxy-client managed path must be distinct."
