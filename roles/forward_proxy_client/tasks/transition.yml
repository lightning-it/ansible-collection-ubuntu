---
- name: Inspect the forward proxy client managed-state marker
  ansible.builtin.stat:
    path: "{{ forward_proxy_client_state_marker_path }}"
    follow: false
  register: forward_proxy_client_state_marker

- name: Reject a dangling forward proxy client state marker
  ansible.builtin.assert:
    that:
      - not forward_proxy_client_state_marker.stat.islnk | default(false)
    fail_msg: >-
      The proxy-client state marker path is a symlink. Stop before treating the
      transition as either owned or unowned state.

- name: Validate the forward proxy client managed-state marker file type
  ansible.builtin.assert:
    that:
      - forward_proxy_client_state_marker.stat.isreg | default(false)
      - not forward_proxy_client_state_marker.stat.islnk | default(false)
      - forward_proxy_client_state_marker.stat.mode == '0600'
      - >-
        forward_proxy_client_state_marker.stat.pw_name | default('')
          == forward_proxy_client_file_owner | string
        or forward_proxy_client_state_marker.stat.uid | string
          == forward_proxy_client_file_owner | string
      - >-
        forward_proxy_client_state_marker.stat.gr_name | default('')
          == forward_proxy_client_file_group | string
        or forward_proxy_client_state_marker.stat.gid | string
          == forward_proxy_client_file_group | string
    fail_msg: "The proxy-client state marker must be a regular non-symlink file."
  when: forward_proxy_client_state_marker.stat.exists

- name: Inspect forward proxy client managed directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ forward_proxy_client_trusted_parent_paths }}"
  register: forward_proxy_client_managed_directory_stats

- name: Refuse unsafe forward proxy client managed directories
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists
        or (
          item.stat.isdir | default(false)
          and not item.stat.islnk | default(false)
          and (
            item.stat.mode is match('^0[0-7][0145][0145]\Z')
            or (
              item.item in ['/tmp', forward_proxy_client_render_root]
              and item.stat.mode == '1777'
              and item.stat.uid == 0
              and item.stat.gid == 0
            )
          )
          and (
            item.stat.uid == 0
            or item.stat.pw_name | default('')
              == forward_proxy_client_file_owner | string
            or item.stat.uid | string
              == forward_proxy_client_file_owner | string
          )
          and (
            item.stat.gid == 0
            or item.stat.gr_name | default('')
              == forward_proxy_client_file_group | string
            or item.stat.gid | string
              == forward_proxy_client_file_group | string
          )
        )
    fail_msg: >-
      A proxy-client directory already exists with a foreign type, owner,
      group, or mode. Stop before changing shared filesystem state.
  loop: "{{ forward_proxy_client_managed_directory_stats.results }}"

- name: Inspect unowned forward proxy client target paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ forward_proxy_client_managed_paths_effective_internal }}"
  register: forward_proxy_client_unowned_target_stats
  when: not forward_proxy_client_state_marker.stat.exists

- name: Refuse to adopt unowned forward proxy client target paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists
      - not item.stat.islnk | default(false)
    fail_msg: >-
      A proxy-client target already exists without the exact adapter ownership
      marker. Stop before overwriting a potentially foreign file.
  loop: "{{ forward_proxy_client_unowned_target_stats.results | default([]) }}"
  when: not forward_proxy_client_state_marker.stat.exists

- name: Read the forward proxy client managed-state marker
  ansible.builtin.slurp:
    src: "{{ forward_proxy_client_state_marker_path }}"
  register: forward_proxy_client_state_marker_content
  when: forward_proxy_client_state_marker.stat.exists

- name: Decode the previous forward proxy client managed state
  ansible.builtin.set_fact:
    forward_proxy_client_previous_state_manifest: >-
      {{ forward_proxy_client_state_marker_content.content | b64decode | from_json }}
  when: forward_proxy_client_state_marker.stat.exists

- name: Initialize empty previous forward proxy client state
  ansible.builtin.set_fact:
    forward_proxy_client_previous_state_manifest:
      schema: lit.ubuntu.forward_proxy_client.managed-state/v6
      owner: lit.ubuntu.forward_proxy_client
      write_state: stable
      managed_paths: []
      managed_checksums: []
      managed_modes: []
      pending_managed_paths: []
      pending_managed_checksums: []
      pending_managed_modes: []
      systemd_activation_pending: false
      restart_pending_services: []
      restart_activated_services: []
  when: not forward_proxy_client_state_marker.stat.exists

- name: Materialize exact desired proxy-client content checksums
  ansible.builtin.set_fact:
    forward_proxy_client_desired_checksums_internal: >-
      {{
        (
          (
            [
              lookup('ansible.builtin.template', role_path ~ '/templates/apt-proxy.conf.j2'),
              lookup('ansible.builtin.template', role_path ~ '/templates/proxy-environment.sh.j2'),
              lookup('ansible.builtin.template', role_path ~ '/templates/proxy-environment.conf.j2'),
              lookup('ansible.builtin.template', role_path ~ '/templates/systemd-environment.conf.j2')
            ]
            + (
                [lookup('ansible.builtin.template', role_path ~ '/templates/containers-proxy.conf.j2')]
                if forward_proxy_client_container_enabled | bool
                else []
              )
          ) | map('hash', 'sha256') | list
        )
        if forward_proxy_client_enabled | bool
        else []
      }}

- name: Bind desired proxy-client checksums to their exact paths
  ansible.builtin.set_fact:
    forward_proxy_client_desired_checksum_map_internal: >-
      {{
        dict(
          forward_proxy_client_managed_paths_effective_internal
          | zip(forward_proxy_client_desired_checksums_internal)
        )
      }}

- name: Bind any pending proxy-client transition to exact checksum and mode maps
  ansible.builtin.set_fact:
    forward_proxy_client_pending_checksum_map_internal: >-
      {{
        dict(
          forward_proxy_client_previous_state_manifest.pending_managed_paths
          | zip(forward_proxy_client_previous_state_manifest.pending_managed_checksums)
        )
      }}
    forward_proxy_client_pending_mode_map_internal: >-
      {{
        dict(
          forward_proxy_client_previous_state_manifest.pending_managed_paths
          | zip(forward_proxy_client_previous_state_manifest.pending_managed_modes)
        )
      }}

- name: Validate the exact previous forward proxy client ownership manifest
  ansible.builtin.assert:
    that:
      - forward_proxy_client_previous_state_manifest is mapping
      - >-
        forward_proxy_client_previous_state_manifest.keys() | list | sort
        == [
          'managed_checksums',
          'managed_modes',
          'managed_paths',
          'owner',
          'pending_managed_checksums',
          'pending_managed_modes',
          'pending_managed_paths',
          'restart_activated_services',
          'restart_pending_services',
          'schema',
          'systemd_activation_pending',
          'write_state'
        ]
      - >-
        forward_proxy_client_previous_state_manifest.schema
        == 'lit.ubuntu.forward_proxy_client.managed-state/v6'
      - forward_proxy_client_previous_state_manifest.owner == 'lit.ubuntu.forward_proxy_client'
      - forward_proxy_client_previous_state_manifest.write_state in ['stable', 'pending']
      - forward_proxy_client_previous_state_manifest.managed_paths is sequence
      - forward_proxy_client_previous_state_manifest.managed_paths is not string
      - forward_proxy_client_previous_state_manifest.managed_checksums is sequence
      - forward_proxy_client_previous_state_manifest.managed_checksums is not string
      - forward_proxy_client_previous_state_manifest.managed_modes is sequence
      - forward_proxy_client_previous_state_manifest.managed_modes is not string
      - forward_proxy_client_previous_state_manifest.pending_managed_paths is sequence
      - forward_proxy_client_previous_state_manifest.pending_managed_paths is not string
      - forward_proxy_client_previous_state_manifest.pending_managed_checksums is sequence
      - forward_proxy_client_previous_state_manifest.pending_managed_checksums is not string
      - forward_proxy_client_previous_state_manifest.pending_managed_modes is sequence
      - forward_proxy_client_previous_state_manifest.pending_managed_modes is not string
      - forward_proxy_client_previous_state_manifest.systemd_activation_pending is boolean
      - forward_proxy_client_previous_state_manifest.restart_pending_services is sequence
      - forward_proxy_client_previous_state_manifest.restart_pending_services is not string
      - forward_proxy_client_previous_state_manifest.restart_activated_services is sequence
      - forward_proxy_client_previous_state_manifest.restart_activated_services is not string
      - >-
        forward_proxy_client_previous_state_manifest.restart_pending_services
        | reject('match', '^[A-Za-z0-9_.@-]{1,128}\Z') | list | length == 0
      - >-
        forward_proxy_client_previous_state_manifest.restart_activated_services
        | unique | list | length
        == forward_proxy_client_previous_state_manifest.restart_activated_services | length
      - >-
        forward_proxy_client_previous_state_manifest.restart_activated_services
        | reject('match', '^[A-Za-z0-9_.@-]{1,128}\Z') | list | length == 0
      - >-
        forward_proxy_client_previous_state_manifest.managed_checksums | length
        == forward_proxy_client_previous_state_manifest.managed_paths | length
      - >-
        forward_proxy_client_previous_state_manifest.managed_modes | length
        == forward_proxy_client_previous_state_manifest.managed_paths | length
      - >-
        forward_proxy_client_previous_state_manifest.managed_modes
        | reject('match', '^0[0-7]{3}\Z') | list | length == 0
      - >-
        forward_proxy_client_previous_state_manifest.managed_checksums
        | reject('match', '^[a-f0-9]{64}\Z') | list | length == 0
      - >-
        forward_proxy_client_previous_state_manifest.pending_managed_checksums | length
        == forward_proxy_client_previous_state_manifest.pending_managed_paths | length
      - >-
        forward_proxy_client_previous_state_manifest.pending_managed_modes | length
        == forward_proxy_client_previous_state_manifest.pending_managed_paths | length
      - >-
        forward_proxy_client_previous_state_manifest.pending_managed_paths
        | unique | list | length
        == forward_proxy_client_previous_state_manifest.pending_managed_paths | length
      - >-
        forward_proxy_client_previous_state_manifest.pending_managed_checksums
        | reject('match', '^[a-f0-9]{64}\Z') | list | length == 0
      - >-
        forward_proxy_client_previous_state_manifest.pending_managed_modes
        | reject('match', '^0[0-7]{3}\Z') | list | length == 0
      - >-
        forward_proxy_client_previous_state_manifest.write_state == 'pending'
        or forward_proxy_client_previous_state_manifest.pending_managed_paths | length == 0
      - >-
        forward_proxy_client_previous_state_manifest.write_state == 'stable'
        or (
          forward_proxy_client_previous_state_manifest.pending_managed_paths
            | difference(forward_proxy_client_all_managed_paths_internal) | length == 0
          and (
            not forward_proxy_client_enabled | bool
            or (
              forward_proxy_client_previous_state_manifest.pending_managed_paths
                == forward_proxy_client_managed_paths_effective_internal
              and forward_proxy_client_previous_state_manifest.pending_managed_checksums
                == forward_proxy_client_desired_checksums_internal
              and forward_proxy_client_previous_state_manifest.pending_managed_modes
                == forward_proxy_client_managed_modes_effective_internal
            )
          )
        )
      - >-
        forward_proxy_client_previous_state_manifest.managed_paths | unique | list | length
        == forward_proxy_client_previous_state_manifest.managed_paths | length
      - >-
        forward_proxy_client_base_managed_paths_internal
        | difference(
            forward_proxy_client_previous_state_manifest.managed_paths
            + (
                forward_proxy_client_previous_state_manifest.pending_managed_paths
                if forward_proxy_client_previous_state_manifest.write_state == 'pending'
                else []
              )
          )
        | length == 0
      - >-
        forward_proxy_client_previous_state_manifest.managed_paths
        | difference(forward_proxy_client_all_managed_paths_internal)
        | length == 0
    fail_msg: >-
      Existing forward proxy client state is not the exact role-owned path
      set. Stop before removing or replacing any file.
  when: forward_proxy_client_state_marker.stat.exists

- name: Validate exact modes for any pending proxy-client transition
  ansible.builtin.assert:
    that:
      - item.0 in forward_proxy_client_all_managed_mode_map_internal
      - item.1 == forward_proxy_client_all_managed_mode_map_internal[item.0]
    fail_msg: >-
      Pending proxy-client paths must retain the role's exact managed modes.
  loop: >-
    {{
      forward_proxy_client_previous_state_manifest.pending_managed_paths
      | zip(forward_proxy_client_previous_state_manifest.pending_managed_modes)
      | list
    }}
  when: forward_proxy_client_state_marker.stat.exists

- name: Bind previously managed proxy-client paths to the trusted parent chain
  ansible.builtin.assert:
    that:
      - item | dirname in forward_proxy_client_trusted_parent_paths
    fail_msg: >-
      Every previously managed proxy-client path must retain an immediate
      directory in the complete trusted parent chain before cleanup.
  loop: >-
    {{
      (
        forward_proxy_client_previous_state_manifest.managed_paths
        + forward_proxy_client_previous_state_manifest.pending_managed_paths
      ) | unique | list
    }}
  when: forward_proxy_client_state_marker.stat.exists

- name: Determine the exact proxy-client directories required by this transition
  ansible.builtin.set_fact:
    forward_proxy_client_required_directories_internal: >-
      {{
        (
          (
            forward_proxy_client_managed_paths_effective_internal
            + [forward_proxy_client_state_marker_path]
          )
          if forward_proxy_client_enabled | bool
          else (
            forward_proxy_client_previous_state_manifest.managed_paths
            + forward_proxy_client_previous_state_manifest.pending_managed_paths
            + (
                [forward_proxy_client_state_marker_path]
                if forward_proxy_client_state_marker.stat.exists
                else []
              )
          )
        ) | map('dirname') | unique | list
      }}

- name: Initialize the check-mode proxy-client directory plan
  ansible.builtin.set_fact:
    forward_proxy_client_planned_directories_internal: []

- name: Create and revalidate each required proxy-client directory boundary
  ansible.builtin.include_tasks: ensure_directory.yml
  loop: "{{ forward_proxy_client_trusted_parent_paths }}"
  loop_control:
    loop_var: forward_proxy_client_directory_path
  when:
    - >-
      forward_proxy_client_directory_path
      in forward_proxy_client_required_directories_internal
      or (
        forward_proxy_client_required_directories_internal
        | select(
            'match',
            '^' ~ (forward_proxy_client_directory_path | regex_escape) ~ '/'
          )
        | list | length > 0
      )

- name: Inspect previously managed forward proxy client files
  ansible.builtin.stat:
    path: "{{ item.0.0 }}"
    follow: false
    checksum_algorithm: sha256
  loop: >-
    {{
      forward_proxy_client_previous_state_manifest.managed_paths
      | zip(forward_proxy_client_previous_state_manifest.managed_checksums)
      | zip(forward_proxy_client_previous_state_manifest.managed_modes)
      | list
    }}
  register: forward_proxy_client_previous_asset_stats
  when: forward_proxy_client_state_marker.stat.exists

- name: Verify previously managed files were not changed outside the role
  ansible.builtin.assert:
    that:
      - >-
        (
          not item.stat.exists
          and not item.stat.islnk | default(false)
        )
        or (
          item.stat.isreg | default(false)
          and not item.stat.islnk | default(false)
          and (
            item.stat.checksum == item.item.0.1
            or (
              forward_proxy_client_previous_state_manifest.write_state == 'pending'
              and item.item.0.0 in forward_proxy_client_pending_checksum_map_internal
              and item.stat.checksum
                == forward_proxy_client_pending_checksum_map_internal[item.item.0.0]
            )
          )
          and item.stat.mode == item.item.1
          and (
            item.stat.pw_name | default('') == forward_proxy_client_file_owner | string
            or item.stat.uid | string == forward_proxy_client_file_owner | string
          )
          and (
            item.stat.gr_name | default('') == forward_proxy_client_file_group | string
            or item.stat.gid | string == forward_proxy_client_file_group | string
          )
        )
    fail_msg: >-
      A previously managed proxy-client path no longer matches the checksum,
      type, owner, group, and mode recorded by the last successful role run.
      Stop before overwriting out-of-band changes. Desired role input or
      template updates are rendered only after this ownership check succeeds.
  loop: "{{ forward_proxy_client_previous_asset_stats.results | default([]) }}"

- name: Inspect newly managed forward proxy client target paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    checksum_algorithm: sha256
  loop: >-
    {{
      (
        forward_proxy_client_previous_state_manifest.pending_managed_paths
        if forward_proxy_client_previous_state_manifest.write_state == 'pending'
        else (
          forward_proxy_client_managed_paths_effective_internal
          if forward_proxy_client_enabled | bool
          else forward_proxy_client_previous_state_manifest.managed_paths
        )
      )
      | difference(forward_proxy_client_previous_state_manifest.managed_paths)
    }}
  register: forward_proxy_client_new_target_stats
  when: forward_proxy_client_state_marker.stat.exists

- name: Refuse to adopt new unowned forward proxy client target paths
  ansible.builtin.assert:
    that:
      - >-
        (
          not item.stat.exists
          and not item.stat.islnk | default(false)
        )
        or (
          forward_proxy_client_previous_state_manifest.write_state == 'pending'
          and item.item in forward_proxy_client_pending_checksum_map_internal
          and item.stat.isreg | default(false)
          and not item.stat.islnk | default(false)
          and item.stat.checksum
            == forward_proxy_client_pending_checksum_map_internal[item.item]
          and item.stat.mode == forward_proxy_client_pending_mode_map_internal[item.item]
          and (
            item.stat.pw_name | default('') == forward_proxy_client_file_owner | string
            or item.stat.uid | string == forward_proxy_client_file_owner | string
          )
          and (
            item.stat.gr_name | default('') == forward_proxy_client_file_group | string
            or item.stat.gid | string == forward_proxy_client_file_group | string
          )
        )
    fail_msg: >-
      A newly enabled proxy-client target already exists outside the ownership
      manifest. Stop before overwriting a potentially foreign file.
  loop: "{{ forward_proxy_client_new_target_stats.results | default([]) }}"
  when: forward_proxy_client_state_marker.stat.exists

- name: Preserve every pending service across proxy-client disable
  ansible.builtin.set_fact:
    forward_proxy_client_disable_restart_services_internal: >-
      {{
        (
          forward_proxy_client_previous_state_manifest.restart_pending_services
          + forward_proxy_client_previous_state_manifest.restart_activated_services
          + forward_proxy_client_restart_services
        ) | unique | list
      }}
  when:
    - not forward_proxy_client_enabled | bool
    - forward_proxy_client_state_marker.stat.exists

- name: Require explicit service cutover before disabling proxy client state
  ansible.builtin.assert:
    that:
      - >-
        forward_proxy_client_systemd_environment_path
        not in (
          forward_proxy_client_previous_state_manifest.managed_paths
          + forward_proxy_client_previous_state_manifest.pending_managed_paths
        )
        or forward_proxy_client_manage_systemd | bool
      - >-
        forward_proxy_client_disable_restart_services_internal | length == 0
        or (
          forward_proxy_client_manage_systemd | bool
          and forward_proxy_client_restart_now | bool
        )
    fail_msg: >-
      Removing managed systemd defaults requires a manager reexec, and pending
      opted-in services require the explicit restart cutover, so no current or
      newly started service keeps stale proxy variables.
  when:
    - not forward_proxy_client_enabled | bool
    - forward_proxy_client_state_marker.stat.exists

- name: Persist pending proxy-client disable activation work
  ansible.builtin.copy:
    content: >-
      {{
        forward_proxy_client_previous_state_manifest
        | combine(
            {
              'systemd_activation_pending': (
                forward_proxy_client_previous_state_manifest.systemd_activation_pending
                or forward_proxy_client_systemd_environment_path
                  in (
                    forward_proxy_client_previous_state_manifest.managed_paths
                    + forward_proxy_client_previous_state_manifest.pending_managed_paths
                  )
              ),
              'restart_pending_services': forward_proxy_client_disable_restart_services_internal,
              'restart_activated_services': []
            }
          )
        | to_nice_json
      }}
    dest: "{{ forward_proxy_client_state_marker_path }}"
    owner: "{{ forward_proxy_client_file_owner }}"
    group: "{{ forward_proxy_client_file_group }}"
    mode: "0600"
    follow: false
    unsafe_writes: false
  when:
    - not ansible_check_mode
    - not forward_proxy_client_enabled | bool
    - forward_proxy_client_state_marker.stat.exists

- name: Remove forward proxy client configuration when disabled
  ansible.builtin.file:
    path: "{{ item.item.0.0 }}"
    state: absent
  loop: "{{ forward_proxy_client_previous_asset_stats.results | default([]) }}"
  when:
    - not forward_proxy_client_enabled | bool
    - forward_proxy_client_state_marker.stat.exists
    - item.stat.exists

- name: Remove exact pending-only proxy-client files when disabled
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ forward_proxy_client_new_target_stats.results | default([]) }}"
  when:
    - not forward_proxy_client_enabled | bool
    - forward_proxy_client_state_marker.stat.exists
    - forward_proxy_client_previous_state_manifest.write_state == 'pending'
    - item.stat.exists

- name: Reload systemd manager after removing proxy client defaults
  ansible.builtin.systemd:
    daemon_reexec: true
    scope: "{{ forward_proxy_client_systemd_scope }}"
  when:
    - not ansible_check_mode
    - not forward_proxy_client_enabled | bool
    - forward_proxy_client_state_marker.stat.exists
    - forward_proxy_client_manage_systemd | bool

- name: Restart opted-in services after disabling the proxy client
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    scope: "{{ forward_proxy_client_systemd_scope }}"
  loop: "{{ forward_proxy_client_disable_restart_services_internal | default([]) }}"
  when:
    - not ansible_check_mode
    - not forward_proxy_client_enabled | bool
    - forward_proxy_client_state_marker.stat.exists
    - forward_proxy_client_manage_systemd | bool
    - forward_proxy_client_restart_now | bool

- name: Remove the forward proxy client managed-state marker when disabled
  ansible.builtin.file:
    path: "{{ forward_proxy_client_state_marker_path }}"
    state: absent
  when:
    - not forward_proxy_client_enabled | bool
    - forward_proxy_client_state_marker.stat.exists

- name: Apply enabled Ubuntu forward proxy client state
  ansible.builtin.include_tasks: enabled.yml
  when: forward_proxy_client_enabled | bool
