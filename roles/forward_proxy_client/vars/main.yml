---
_forward_proxy_client_base_managed_paths:
  - "{{ forward_proxy_client_apt_config_path }}"
  - "{{ forward_proxy_client_profile_path }}"
  - "{{ forward_proxy_client_environment_path }}"
  - "{{ forward_proxy_client_systemd_environment_path }}"
_forward_proxy_client_all_managed_paths: >-
  {{ _forward_proxy_client_base_managed_paths + [forward_proxy_client_containers_config_path] }}
_forward_proxy_client_managed_paths_effective: >-
  {{
    _forward_proxy_client_all_managed_paths
    if forward_proxy_client_container_enabled | bool
    else _forward_proxy_client_base_managed_paths
  }}
