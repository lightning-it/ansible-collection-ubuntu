---
minor_changes:
  - >-
    Allow the developer_tools role to upgrade operating-system Node.js
    packages by setting developer_tools_nodejs_package_state to latest.
bugfixes:
  - >-
    Reconcile missing Incus storage pools from the preseed even when another
    pool already initialized the daemon.
  - >-
    Reconcile declared Incus preseed networks when the daemon was already
    initialized with different bridge settings.
  - >-
    Match generated Incus cloud-init networking to both container and virtual
    machine Ethernet interface names instead of assuming an incus0 device.
  - >-
    Allow the Podman role to restore and reload Ubuntu's package-compatible
    unconfined Buildah AppArmor attachment profile independently.
  - >-
    Allow the Podman role to restore and reload explicitly declared helper
    attachment profiles needed by the rootless container toolchain.
