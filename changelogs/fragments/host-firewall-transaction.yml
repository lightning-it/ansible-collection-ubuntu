minor_changes:
  - >-
    host_firewall - add a fail-closed Ubuntu 24.04 nftables policy with per-function IPv4/IPv6 management sources,
    canonical JSON readback, isolated table/include ownership, and a serialized rollback-protected lifecycle.
security_fixes:
  - >-
    host_firewall - prohibit whole-ruleset backup/replay and root nftables configuration replacement, execute nft
