---
breaking_changes:
  - >-
    Raise collection minimum ``requires_ansible`` from ``>=2.16.1`` to
    ``>=2.18``. Consumers running ansible-core below 2.18 must upgrade before
    using this collection release.

minor_changes:
  - >-
    Harden the cis_ubuntu24 integration with separate fail-closed remediation
    and audit modes, exact native-profile validation, an inventory exception
    schema, immutable remediation and audit dependency metadata, and idempotent
    handling of the package AIDE service when the cron scheduler is selected.
    Preserve a traversable audit log directory when inventory disables the
    pinned upstream role's defective recursive file-mode remediation, and
    persist the network sysctls whose pinned audit persistence checks are
    malformed.
