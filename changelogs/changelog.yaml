  1.7.0:
    changes:
      bugfixes:
        - shared_tooling - Dispatch collection publishing from protected main with
          the managed release environment and Galaxy credential, make lint compatibility
          detection rely on the execution environment, and ignore generated local
          collection-install and Python cache artifacts.
      minor_changes:
        - Add the inventory-driven ``lit.ubuntu.openssh_server`` role with validated
          multi-port transition support, Ubuntu systemd socket-activation reconciliation,
          check-mode coverage, directive-injection protection, and secure public-key-only
          defaults.
        - Added guarded Ubuntu LUKS initramfs unlock automation with a secret-free
          Hetzner installimage Dropbear bootstrap, pinned Clevis Tang bindings, and
          a minimal Tang socket deployment role.
        - developer_tools - Add configurable Node.js/npm/npx installation and markdownlint-cli2
          validation support.
        - docs - Apply the shared enterprise README structure.
        - docs - Consolidate generated governance metadata and license policy on shared-assets-lit.
