---
- name: Clean up the Ubuntu 24 CIS integration fixture
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove the generated upstream role fixture
      ansible.builtin.file:
        path: >-
          {{
            lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY')
          }}/roles/ansible-lockdown.ubuntu24_cis
        state: absent
      tags: always

    - name: Remove the non-matching upstream profile evidence
      ansible.builtin.file:
        path: /tmp/lit-ubuntu-cis-molecule-excluded
        state: absent
      tags: always

    - name: Remove the disabled persistent network kernel controls
      ansible.builtin.file:
        path: /tmp/lit-ubuntu-cis-network-disabled.conf
        state: absent
      tags: always
