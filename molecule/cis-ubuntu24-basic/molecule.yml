---
dependency:
  name: shell
  command: >-
    install -D -m 0644
    "${MOLECULE_SCENARIO_DIRECTORY}/fixtures/upstream-role-main.yml"
    "${MOLECULE_SCENARIO_DIRECTORY}/roles/ansible-lockdown.ubuntu24_cis/tasks/main.yml"

driver:
  name: docker

platforms:
  - name: cis_ubuntu24
    image: ubuntu:24.04
    pre_build_image: true
    command: sleep infinity
    network_mode: host

provisioner:
  name: ansible
  options:
    tags: level1-server
  inventory:
    hosts:
      all:
        hosts:
          cis_ubuntu24:
            ansible_connection: docker
  playbooks:
    cleanup: cleanup.yml
    converge: converge.yml
    verify: verify.yml

scenario:
  name: cis-ubuntu24-basic
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
