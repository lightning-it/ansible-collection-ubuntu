---
- name: Verify users role execution
  hosts: users
  gather_facts: false
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Check lit.ubuntu.users coverage marker
      ansible.builtin.stat:
        path: /tmp/lit-users-molecule-execution
      register: users_molecule_coverage_marker

    - name: Read Molecule user supplementary groups
      ansible.builtin.command:
        argv:
          - id
          - -nG
          - lit-molecule-user
      register: users_molecule_groups
      changed_when: false

    - name: Read Molecule user authorized keys
      ansible.builtin.slurp:
        src: /home/lit-molecule-user/.ssh/authorized_keys
      register: users_molecule_authorized_keys

    - name: Read mandatory global user sudo policy
      ansible.builtin.slurp:
        src: /etc/sudoers.d/90-lit-molecule-global-user
      register: users_molecule_global_sudo

    - name: Assert lit.ubuntu.users reconciled exact access
      ansible.builtin.assert:
        that:
          - users_molecule_coverage_marker.stat.exists
          - users_molecule_coverage_marker.stat.size == 14
          - >-
            (users_molecule_groups.stdout.split() | sort)
            == (['lit-molecule-group', 'lit-molecule-user'] | sort)
          - >-
            (users_molecule_authorized_keys.content | b64decode | trim)
            == (users_molecule_desired_key | trim)
          - "'stale@molecule.invalid' not in (users_molecule_authorized_keys.content | b64decode)"
          - >-
            (users_molecule_global_sudo.content | b64decode | trim)
            == 'lit-molecule-global-user ALL=(ALL) NOPASSWD:ALL'
        quiet: true
      vars:
        users_molecule_desired_key: >-
          ssh-ed25519
          AAAAC3NzaC1lZDI1NTE5AAAAIEjzifs06betrcygee7kUrE1IMhU4p0M3P5ZsaMVsEbo
          desired@molecule.invalid

    - name: Verify whitespace-only SSH keys fail closed
      block:
        - name: Exercise users validation with a whitespace-only SSH key
          ansible.builtin.include_role:
            name: lit.ubuntu.users
            tasks_from: assert.yml
          vars:
            users_accounts:
              - name: invalid-whitespace-key
                ssh_keys:
                  - "   "
            users_accounts_extra: []
            users_accounts_global: []
            users_manage_groups: false

        - name: Fail when a whitespace-only SSH key passes validation
          ansible.builtin.fail:
            msg: "A whitespace-only SSH key unexpectedly passed validation."
      rescue:
        - name: Confirm whitespace-only SSH keys use the safe validation failure
          ansible.builtin.assert:
            that:
              - >-
                'must be a list of non-empty, single-line strings'
                in (ansible_failed_result | string)

    - name: Verify multiline SSH keys fail closed
      block:
        - name: Exercise users validation with a multiline SSH key
          ansible.builtin.include_role:
            name: lit.ubuntu.users
            tasks_from: assert.yml
          vars:
            users_accounts:
              - name: invalid-multiline-key
                ssh_keys:
                  - |-
                    ssh-ed25519 AAAA-invalid-first-line
                    ssh-ed25519 AAAA-injected-second-line
            users_accounts_extra: []
            users_accounts_global: []
            users_manage_groups: false

        - name: Fail when a multiline SSH key passes validation
          ansible.builtin.fail:
            msg: "A multiline SSH key unexpectedly passed validation."
      rescue:
        - name: Confirm multiline SSH keys use the safe validation failure
          ansible.builtin.assert:
            that:
              - >-
                'must be a list of non-empty, single-line strings'
                in (ansible_failed_result | string)
