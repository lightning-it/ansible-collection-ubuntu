---
- name: Converge Ubuntu forward proxy client configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    forward_proxy_client_test_root: /tmp/wunder/lit-forward-proxy-client-molecule
    host_firewall_container_interfaces:
      - podman0
    host_firewall_forward_proxy_egress:
      enabled: true
      status: approved
      owner_username: proxy
      mode: direct
      ports:
        - 80
        - 443
    host_firewall_forward_proxy_access:
      enabled: true
      port: 3128
      interfaces:
        - podman0
      sources_ipv4:
        - 10.89.0.0/24
      destination_ipv4: 10.89.0.1
  pre_tasks:
    - name: Read rootless test UID
      ansible.builtin.command: id -u
      register: forward_proxy_client_test_uid
      changed_when: false

    - name: Read rootless test GID
      ansible.builtin.command: id -g
      register: forward_proxy_client_test_gid
      changed_when: false
  roles:
    - role: lit.ubuntu.forward_proxy_client
      forward_proxy_client_enabled: true
      forward_proxy_client_manage_systemd: false
      forward_proxy_client_file_owner: "{{ forward_proxy_client_test_uid.stdout }}"
      forward_proxy_client_file_group: "{{ forward_proxy_client_test_gid.stdout }}"
      forward_proxy_client_container_enabled: true
      forward_proxy_client_listen_addresses:
        - 127.0.0.1
        - 10.89.0.1
      forward_proxy_client_allowed_clients:
        - 127.0.0.1/32
        - 10.89.0.0/24
      forward_proxy_client_no_proxy:
        - localhost
        - 127.0.0.1
        - .internal.example
        - apt.internal.example
      forward_proxy_client_apt_direct_hosts:
        - localhost
        - 127.0.0.1
      forward_proxy_client_apt_config_path: >-
        {{ forward_proxy_client_test_root }}/etc/apt/99-lit-forward-proxy
      forward_proxy_client_profile_path: >-
        {{ forward_proxy_client_test_root }}/etc/profile.d/90-lit-forward-proxy.sh
      forward_proxy_client_environment_path: >-
        {{ forward_proxy_client_test_root }}/etc/environment.d/90-lit-forward-proxy.conf
      forward_proxy_client_systemd_environment_path: >-
        {{ forward_proxy_client_test_root }}/etc/systemd/system.conf.d/90-lit-forward-proxy.conf
      forward_proxy_client_containers_config_path: >-
        {{ forward_proxy_client_test_root }}/etc/containers/containers.conf.d/90-lit-forward-proxy.conf
      forward_proxy_client_state_marker_path: >-
        {{ forward_proxy_client_test_root }}/var/lib/lit-forward-proxy-client/managed.json
