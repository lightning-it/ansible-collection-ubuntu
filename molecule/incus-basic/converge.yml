---
- name: Converge incus
  hosts: incus
  become: false
  gather_facts: false
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    incus_packages: []
    incus_services: []
    incus_preseed:
      storage_pools:
        - name: default
          driver: dir
    incus_projects:
      - name: workbench
        config:
          features.images: "false"
    incus_profiles:
      - name: workbench
        project: workbench
        description: Workbench test profile
        config:
          limits.cpu: "2"
        devices:
          root:
            type: disk
            path: /
            pool: default

  pre_tasks:
    - name: Ensure python3 is present
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update && apt-get -y install python3
        fi
      changed_when: false

    - name: Install fake Incus CLI
      ansible.builtin.copy:
        src: incus-fake.py
        dest: /usr/local/bin/incus
        owner: root
        group: root
        mode: "0755"

  roles:
    - role: lit.ubuntu.incus
