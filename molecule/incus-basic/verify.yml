---
- name: Verify incus
  hosts: incus
  become: false
  gather_facts: false

  tasks:
    - name: Read Incus root SubUID allocation
      ansible.builtin.slurp:
        src: /tmp/incus-molecule-subuid
      register: incus_subuid_state

    - name: Read Incus root SubGID allocation
      ansible.builtin.slurp:
        src: /tmp/incus-molecule-subgid
      register: incus_subgid_state

    - name: Read Incus storage state
      ansible.builtin.command:
        argv:
          - incus
          - storage
          - list
          - --format
          - json
      register: incus_storage_state
      changed_when: false

    - name: Read Incus project state
      ansible.builtin.command:
        argv:
          - incus
          - project
          - list
          - --format
          - json
      register: incus_project_state
      changed_when: false

    - name: Read Incus network state
      ansible.builtin.command:
        argv: [incus, network, list, --format, json]
      register: incus_network_state
      changed_when: false

    - name: Read Incus profile state
      ansible.builtin.command:
        argv:
          - incus
          - profile
          - list
          - --project
          - workbench
          - --format
          - json
      register: incus_profile_state
      changed_when: false

    - name: Read fake Incus mutation log
      ansible.builtin.command:
        cmd: grep -v '^$' /var/lib/incus-fake/mutations.log
      register: incus_mutations
      changed_when: false

    - name: Decode fake Incus state
      ansible.builtin.set_fact:
        incus_storage_state_decoded: "{{ incus_storage_state.stdout | from_json }}"
        incus_project_state_decoded: "{{ incus_project_state.stdout | from_json }}"
        incus_network_state_decoded: "{{ incus_network_state.stdout | from_json }}"
        incus_profile_state_decoded: "{{ incus_profile_state.stdout | from_json }}"
      changed_when: false

    - name: Assert declarative Incus state and idempotent mutation count
      ansible.builtin.assert:
        that:
          - incus_storage_state_decoded | map(attribute='name') | list == ['default']
          - incus_project_state_decoded | selectattr('name', 'equalto', 'workbench') | list | length == 1
          - >-
            incus_project_state_decoded
            | selectattr('name', 'equalto', 'workbench')
            | map(attribute='config')
            | first == expected_incus_project_config
          - incus_profile_state_decoded | length == 1
          - incus_profile_state_decoded.0.description == 'Workbench test profile'
          - incus_profile_state_decoded.0.config == expected_incus_profile_config
          - incus_profile_state_decoded.0.devices.root.type == 'disk'
          - incus_network_state_decoded | length == 1
          - incus_network_state_decoded.0.name == 'incusbr0'
          - incus_network_state_decoded.0.config == expected_incus_network_config
          - (incus_subuid_state.content | b64decode | trim) == 'root:1000000:10000000'
          - (incus_subgid_state.content | b64decode | trim) == 'root:1000000:10000000'
          - incus_mutations.stdout_lines == expected_incus_mutations
        fail_msg: "Incus fake state did not match the declaration or the role mutated it more than once."
      vars:
        expected_incus_project_config:
          features.images: "false"
        expected_incus_profile_config:
          limits.cpu: "2"
        expected_incus_network_config:
          ipv4.address: 10.221.0.1/24
          ipv4.nat: "true"
        expected_incus_mutations:
          - storage create default dir
          - network create incusbr0
          - project create workbench
          - project set workbench features.images=false
          - profile create workbench --project workbench
          - profile edit workbench --project workbench
