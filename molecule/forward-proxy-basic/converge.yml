---
- name: Converge forward proxy configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    forward_proxy_test_root: /tmp/wunder/lit-forward-proxy-molecule
  pre_tasks:
    - name: Read rootless test UID
      ansible.builtin.command: id -u
      register: forward_proxy_test_uid
      changed_when: false

    - name: Read rootless test GID
      ansible.builtin.command: id -g
      register: forward_proxy_test_gid
      changed_when: false
  roles:
    - role: lit.ubuntu.forward_proxy
      forward_proxy_enabled: true
      forward_proxy_manage_package: false
      forward_proxy_manage_service: false
      forward_proxy_file_owner: "{{ forward_proxy_test_uid.stdout }}"
      forward_proxy_file_group: "{{ forward_proxy_test_gid.stdout }}"
      forward_proxy_container_enabled: true
      forward_proxy_listen_addresses:
        - 127.0.0.1
        - 192.0.2.1
      forward_proxy_allowed_clients:
        - 127.0.0.1/32
        - 192.0.2.0/24
      forward_proxy_allowed_destination_domains:
        - .ubuntu.com
        - registry.example.com
      forward_proxy_upstream_enabled: true
      forward_proxy_upstream_host: proxy.customer.example
      forward_proxy_upstream_port: 8080
      forward_proxy_no_proxy:
        - localhost
        - 127.0.0.1
        - .internal.example
      forward_proxy_config_path: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
      forward_proxy_apt_config_path: "{{ forward_proxy_test_root }}/etc/apt/90-lit-forward-proxy"
      forward_proxy_profile_path: "{{ forward_proxy_test_root }}/etc/profile.d/90-lit-forward-proxy.sh"
      forward_proxy_environment_path: "{{ forward_proxy_test_root }}/etc/environment.d/90-lit-forward-proxy.conf"
      forward_proxy_systemd_environment_path: >-
        {{ forward_proxy_test_root }}/etc/systemd/system.conf.d/90-lit-forward-proxy.conf
      forward_proxy_containers_config_path: >-
        {{ forward_proxy_test_root }}/etc/containers/containers.conf.d/90-lit-forward-proxy.conf
