---
- name: Verify forward proxy configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    forward_proxy_test_root: /tmp/wunder/lit-forward-proxy-molecule
  tasks:
    - name: Read rendered Squid policy
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
      register: forward_proxy_squid_config

    - name: Read rendered apt policy
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/apt/90-lit-forward-proxy"
      register: forward_proxy_apt_config

    - name: Read rendered Podman policy
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/containers/containers.conf.d/90-lit-forward-proxy.conf"
      register: forward_proxy_containers_config

    - name: Assert the local proxy and upstream chain are closed and consistent
      ansible.builtin.assert:
        that:
          - "'http_port 127.0.0.1:3128' in (forward_proxy_squid_config.content | b64decode)"
          - "'acl lit_clients src 127.0.0.1/32' in (forward_proxy_squid_config.content | b64decode)"
          - >-
            'acl lit_allowed_domains dstdomain .ubuntu.com registry.example.com'
            in (forward_proxy_squid_config.content | b64decode)
          - >-
            'cache_peer proxy.customer.example parent 8080 0 no-query default'
            in (forward_proxy_squid_config.content | b64decode)
          - "'never_direct allow all' in (forward_proxy_squid_config.content | b64decode)"
          - "'http_access deny all' in (forward_proxy_squid_config.content | b64decode)"
          - "'acl lit_connect method CONNECT' in (forward_proxy_squid_config.content | b64decode)"
          - "'http_access deny lit_connect !lit_ssl_ports' in (forward_proxy_squid_config.content | b64decode)"
          - >-
            'Acquire::https::Proxy "http://127.0.0.1:3128";'
            in (forward_proxy_apt_config.content | b64decode)
          - "'http_proxy = true' in (forward_proxy_containers_config.content | b64decode)"
          - >-
            'HTTPS_PROXY=http://host.containers.internal:3128'
            in (forward_proxy_containers_config.content | b64decode)
        quiet: true
