---
- name: Verify forward proxy configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    forward_proxy_test_root: /tmp/wunder/lit-forward-proxy-molecule
  tasks:
    - name: Read rendered Squid policy
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
      register: forward_proxy_squid_config

    - name: Read rendered apt policy
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/apt/99-lit-forward-proxy"
      register: forward_proxy_apt_config

    - name: Read rendered Squid Pod manifest
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
      register: forward_proxy_pod_manifest

    - name: Read rendered Podman policy
      ansible.builtin.slurp:
        src: "{{ forward_proxy_test_root }}/etc/containers/containers.conf.d/90-lit-forward-proxy.conf"
      register: forward_proxy_containers_config

    - name: Assert the local proxy and upstream chain are closed and consistent
      ansible.builtin.assert:
        that:
          - "'http_port 127.0.0.1:3128' in (forward_proxy_squid_config.content | b64decode)"
          - "'acl lit_clients src 127.0.0.1/32' in (forward_proxy_squid_config.content | b64decode)"
          - >-
            'acl lit_allowed_domains dstdomain .ubuntu.com registry.example.com'
            in (forward_proxy_squid_config.content | b64decode)
          - >-
            'cache_peer proxy.customer.example parent 8080 0 no-query default'
            in (forward_proxy_squid_config.content | b64decode)
          - "'never_direct allow all' in (forward_proxy_squid_config.content | b64decode)"
          - "'http_access deny all' in (forward_proxy_squid_config.content | b64decode)"
          - "'acl lit_connect method CONNECT' in (forward_proxy_squid_config.content | b64decode)"
          - "'http_access deny lit_connect !lit_ssl_ports' in (forward_proxy_squid_config.content | b64decode)"
          - "'http_access deny !lit_connect !lit_http_ports' in (forward_proxy_squid_config.content | b64decode)"
          - "'pid_filename /tmp/squid.pid' in (forward_proxy_squid_config.content | b64decode)"
          - "'cache_log /dev/stderr' in (forward_proxy_squid_config.content | b64decode)"
          - >-
            'docker.io/ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029'
            in (forward_proxy_pod_manifest.content | b64decode)
          - "'imagePullPolicy: Never' in (forward_proxy_pod_manifest.content | b64decode)"
          - "'hostNetwork: true' in (forward_proxy_pod_manifest.content | b64decode)"
          - "'runAsUser: 13' in (forward_proxy_pod_manifest.content | b64decode)"
          - "'readOnlyRootFilesystem: true' in (forward_proxy_pod_manifest.content | b64decode)"
          - >-
            'Acquire::https::Proxy "http://127.0.0.1:3128";'
            in (forward_proxy_apt_config.content | b64decode)
          - >-
            'Acquire::http::Proxy::localhost "DIRECT";'
            in (forward_proxy_apt_config.content | b64decode)
          - >-
            'Acquire::https::Proxy::127.0.0.1 "DIRECT";'
            in (forward_proxy_apt_config.content | b64decode)
          - "'http_proxy = true' in (forward_proxy_containers_config.content | b64decode)"
          - >-
            'HTTPS_PROXY=http://host.containers.internal:3128'
            in (forward_proxy_containers_config.content | b64decode)
        quiet: true

    - name: Disable the previously managed forward proxy
      ansible.builtin.include_role:
        name: lit.ubuntu.forward_proxy
      vars:
        forward_proxy_enabled: false
        forward_proxy_manage_runtime: false
        forward_proxy_config_path: "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
        forward_proxy_pod_manifest_path: "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
        forward_proxy_apt_config_path: "{{ forward_proxy_test_root }}/etc/apt/99-lit-forward-proxy"
        forward_proxy_profile_path: "{{ forward_proxy_test_root }}/etc/profile.d/90-lit-forward-proxy.sh"
        forward_proxy_environment_path: "{{ forward_proxy_test_root }}/etc/environment.d/90-lit-forward-proxy.conf"
        forward_proxy_systemd_environment_path: >-
          {{ forward_proxy_test_root }}/etc/systemd/system.conf.d/90-lit-forward-proxy.conf
        forward_proxy_containers_config_path: >-
          {{ forward_proxy_test_root }}/etc/containers/containers.conf.d/90-lit-forward-proxy.conf
        forward_proxy_state_marker_path: "{{ forward_proxy_test_root }}/var/lib/lit-forward-proxy/managed.json"

    - name: Inspect disabled forward proxy paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ forward_proxy_test_root }}/etc/squid/squid.conf"
        - "{{ forward_proxy_test_root }}/etc/squid/squid-pod.yml"
        - "{{ forward_proxy_test_root }}/etc/apt/99-lit-forward-proxy"
        - "{{ forward_proxy_test_root }}/etc/profile.d/90-lit-forward-proxy.sh"
        - "{{ forward_proxy_test_root }}/etc/environment.d/90-lit-forward-proxy.conf"
        - "{{ forward_proxy_test_root }}/etc/systemd/system.conf.d/90-lit-forward-proxy.conf"
        - "{{ forward_proxy_test_root }}/etc/containers/containers.conf.d/90-lit-forward-proxy.conf"
        - "{{ forward_proxy_test_root }}/var/lib/lit-forward-proxy/managed.json"
      register: forward_proxy_disabled_paths

    - name: Assert disabled state removes only previously managed proxy state
      ansible.builtin.assert:
        that:
          - forward_proxy_disabled_paths.results | selectattr('stat.exists') | list | length == 0
        quiet: true
