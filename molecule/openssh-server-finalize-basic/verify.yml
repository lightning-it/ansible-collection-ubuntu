---
- name: Verify deterministic SSH transaction safety regressions
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Run packaged transaction guard and recovery regressions
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -m
          - unittest
          - discover
          - -s
          - >-
            {{ lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH').split(':')[0]
               }}/ansible_collections/lit/ubuntu/tests/unit
          - -p
          - test_openssh_transaction.py
          - -v
      changed_when: false
