---
- name: Prepare host firewall command doubles
  hosts: host-firewall.example.test
  become: false
  gather_facts: false
  vars:
    host_firewall_test_directory: /tmp/wunder/lit-host-firewall-molecule
  tasks:
    - name: Reset host firewall test directory
      ansible.builtin.file:
        path: "{{ host_firewall_test_directory }}"
        state: absent

    - name: Create host firewall test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ host_firewall_test_directory }}"
        - "{{ host_firewall_test_directory }}/nftables.d"
        - "{{ host_firewall_test_directory }}/state"
        - "{{ host_firewall_test_directory }}/bin"
        - "{{ host_firewall_test_directory }}/systemd"

    - name: Install administrator-owned root configuration fixture
      ansible.builtin.copy:
        dest: "{{ host_firewall_test_directory }}/nftables.conf"
        mode: "0600"
        content: |
          # Administrator-owned foreign policy remains outside the role boundary.
          table inet foreign_table {
            chain input { type filter hook input priority 0; policy accept; }
          }
          include "{{ host_firewall_test_directory }}/nftables.d/lit-host-firewall.nft"

    - name: Install valid preprovisioned rollback placeholder include
      ansible.builtin.copy:
        dest: "{{ host_firewall_test_directory }}/nftables.d/lit-host-firewall.nft"
        mode: "0600"
        content: |
          # Valid empty role-owned rollback baseline.

    - name: Install deterministic structured nft readback fixture
      ansible.builtin.copy:
        dest: "{{ host_firewall_test_directory }}/runtime.json"
        mode: "0600"
        content: |
          {{ _host_firewall_runtime_fixture | to_json }}
      vars:
        _host_firewall_runtime_fixture:
          nftables:
            - metainfo:
                version: 1.0.9
                json_schema_version: 1
            - table:
                family: inet
                name: lit_host_firewall
                handle: 9
            - chain:
                family: inet
                table: lit_host_firewall
                name: input
                type: filter
                hook: input
                prio: 10
                policy: drop
                handle: 10
            - rule:
                family: inet
                table: lit_host_firewall
                chain: input
                handle: 11
                expr:
                  - counter:
                      packets: 7
                      bytes: 42
                  - drop: null

    - name: Install deterministic nft command double
      ansible.builtin.copy:
        dest: "{{ host_firewall_test_directory }}/nft"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          test_directory=/tmp/wunder/lit-host-firewall-molecule
          echo "$*" >> "${test_directory}/nft.log"

          if [[ "${1:-}" == '--check' && "${2:-}" == '--file' ]]; then
            if [[ "${3:-}" == '-' ]]; then
              policy="$(/bin/cat)"
            else
              policy="$(/bin/cat "${3}")"
            fi
            ! grep --quiet 'flush ruleset' <<<"${policy}"
            grep --quiet 'destroy table inet lit_host_firewall' <<<"${policy}"
            grep --quiet 'type filter hook input priority 10; policy drop;' <<<"${policy}"
            grep --quiet 'type filter hook forward priority 10; policy drop;' <<<"${policy}"
            grep --quiet 'type filter hook output priority 10; policy drop;' <<<"${policy}"
            exit 0
          fi

          if [[ "${1:-}" == '--json' && "${2:-}" == 'list' && "${3:-}" == 'table' ]]; then
            /bin/cat "${test_directory}/runtime.json"
            exit 0
          fi

          if [[ "${1:-}" == 'list' && "${2:-}" == 'table' ]]; then
            echo 'table inet lit_host_firewall { chain input { type filter hook input priority 10; policy drop; } }'
            exit 0
          fi

          echo "Unsupported nft test invocation: $*" >&2
          exit 64

    - name: Install deterministic systemctl command double
      ansible.builtin.copy:
        dest: "{{ host_firewall_test_directory }}/systemctl"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "$*" >> /tmp/wunder/lit-host-firewall-molecule/systemctl.log
          if [[ "$*" == 'is-enabled nftables.service' ]]; then
            echo enabled
            exit 0
          fi
          if [[ "${1:-}" == 'is-active' ]]; then
            exit 3
          fi
          exit 0
