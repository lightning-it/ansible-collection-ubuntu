---
host_firewall_egress_policy:
  schema: lit.host_firewall.egress/v1
  status: draft
  stance: bootstrap-restricted
  ipv4_only: true
  functions:
    dns_udp:
      enabled: true
      status: approved
      protocol: udp
      port: 53
      modes: [bootstrap, hardened]
      interface: "{{ host_firewall_public_interface }}"
      destinations_ipv4: [1.1.1.1/32, 8.8.8.8/32]
      destinations_ipv6: []
      declared_fqdns: []
      mtls_required: false
      residual: ""
    dns_tcp:
      enabled: true
      status: approved
      protocol: tcp
      port: 53
      modes: [bootstrap, hardened]
      interface: "{{ host_firewall_public_interface }}"
      destinations_ipv4: [1.1.1.1/32, 8.8.8.8/32]
      destinations_ipv6: []
      declared_fqdns: []
      mtls_required: false
      residual: ""
    ntp:
      enabled: true
      status: transitional-port-only
      protocol: udp
      port: 123
      modes: [bootstrap, hardened]
      interface: "{{ host_firewall_public_interface }}"
      destinations_ipv4: [0.0.0.0/0]
      destinations_ipv6: []
      declared_fqdns: [ntp1.hetzner.de, ntp2.hetzner.com, ntp3.hetzner.net]
      mtls_required: false
      residual: "Destination restriction remains open until stable resolver-bound NTP addresses exist."
    atlas_loki:
      enabled: true
      status: approved
      protocol: tcp
      port: 3100
      modes: [bootstrap, hardened]
      interface: "{{ host_firewall_management_interface }}"
      destinations_ipv4: [10.10.30.24/32]
      destinations_ipv6: []
      declared_fqdns: []
      mtls_required: true
      residual: "mTLS identity and trust evidence are validated outside nftables."
    bootstrap_https:
      enabled: true
      status: temporary-maintenance
      protocol: tcp
      port: 443
      modes: [bootstrap]
      interface: "{{ host_firewall_public_interface }}"
      destinations_ipv4: [0.0.0.0/0]
      destinations_ipv6: []
      declared_fqdns: []
      mtls_required: false
      residual: "Temporary package bootstrap exception; productive confirmation is prohibited."
    https_proxy:
      enabled: false
      status: disabled-staged-transfer
      protocol: tcp
      port: 3128
      modes: [hardened]
      interface: "{{ host_firewall_management_interface }}"
      destinations_ipv4: []
      destinations_ipv6: []
      declared_fqdns: [mirror.hetzner.com, fsn1.your-objectstorage.com, bucket.fsn1.your-objectstorage.com]
      mtls_required: false
      residual: "Controller-pull and staged transfer remain authoritative while the management proxy is disabled."
