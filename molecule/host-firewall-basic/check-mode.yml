---
- name: Verify global check-mode firewall validation
  hosts: host-firewall.example.test
  become: false
  gather_facts: false
  vars:
    host_firewall_test_directory: /tmp/wunder/lit-host-firewall-molecule
    host_firewall_enabled: true
    host_firewall_action: apply
    host_firewall_mode: bootstrap
    host_firewall_expected_inventory_hostname: host-firewall.example.test
    host_firewall_expected_public_ipv4: 192.0.2.10
    host_firewall_expected_management_ipv4: 10.0.30.10
    host_firewall_observed_ipv4_addresses: [192.0.2.10, 10.0.30.10]
    host_firewall_observed_ipv6_addresses: []
    host_firewall_platform_name: Ubuntu
    host_firewall_platform_version: "24.04"
    host_firewall_public_interface: enp1s0
    host_firewall_management_interface: enp1s0.4091
    host_firewall_container_interfaces: [podman0]
    host_firewall_management_access:
      bootstrap_ssh:
        port: 22
        modes: [bootstrap]
        sources_ipv4: [198.51.100.20/32]
        sources_ipv6: []
      openssh:
        port: 1905
        modes: [bootstrap, hardened]
        sources_ipv4: [198.51.100.20/32]
        sources_ipv6: []
      dropbear:
        port: 2222
        modes: [bootstrap, hardened]
        sources_ipv4: [198.51.100.20/32]
        sources_ipv6: []
    host_firewall_tang_access:
      port: 80
      sources_ipv4: [192.0.2.21/32, 192.0.2.22/32, 192.0.2.23/32]
      sources_ipv6: []
    host_firewall_nft_binary: /tmp/wunder/lit-host-firewall-molecule/nft
    host_firewall_systemctl_binary: /tmp/wunder/lit-host-firewall-molecule/systemctl
    host_firewall_flock_binary: /tmp/wunder/lit-host-firewall-molecule/flock
    host_firewall_change_id: WBX-G2-CHECK-MODE
    host_firewall_approved_readback_sha256: 586745c405ef46dbe8af5f7768deaf4b0ea7bcbcb9d9be72d712c36bd52594fa
  tasks:
    - name: Execute apply path under global check mode
      ansible.builtin.include_role:
        name: lit.ubuntu.host_firewall

    - name: Inspect mutation command log after global check mode
      ansible.builtin.stat:
        path: "{{ host_firewall_test_directory }}/systemctl.log"
      register: host_firewall_global_check_systemctl_log
      changed_when: false

    - name: Validate real nft check and absence of mutation calls
      ansible.builtin.assert:
        that:
          - not host_firewall_check_result.skipped | default(false)
          - host_firewall_check_result.rc == 0
          - not host_firewall_global_check_systemctl_log.stat.exists
