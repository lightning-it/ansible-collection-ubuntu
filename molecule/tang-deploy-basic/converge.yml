---
- name: Converge Tang deployment
  hosts: tang_deploy
  become: false
  gather_facts: false
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    tang_deploy_test_dir: /tmp/lit-tang-deploy-molecule

  pre_tasks:
    - name: Ensure python3 is present
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update && apt-get -y install python3
        fi
      changed_when: false

    - name: Create Tang deployment test directory
      ansible.builtin.file:
        path: "{{ tang_deploy_test_dir }}"
        state: directory
        mode: "0700"

  roles:
    - role: lit.ubuntu.tang_deploy
      vars:
        tang_deploy_enabled: true
        tang_deploy_manage_packages: false
        tang_deploy_manage_service: false
        tang_deploy_manage_socket_override: true
        tang_deploy_listen_port: 18080
        tang_deploy_socket_override_path: "{{ tang_deploy_test_dir }}/tangd.socket.d/80-lit-listen.conf"
        tang_deploy_validate: false
