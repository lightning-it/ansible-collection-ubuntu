---
- name: Converge developer tools role execution
  hosts: developer_tools
  gather_facts: false
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    developer_tools_molecule_execute_role: true
    developer_tools_python_venv_enabled: false
    developer_tools_python_venv_packages:
      - ansible-core==2.18.18
    developer_tools_python_venv_commands:
      - ansible
    developer_tools_nodejs_enabled: false
    developer_tools_workspace_enabled: true
    developer_tools_workspace_users:
      - root
    developer_tools_workspace_directories:
      - .cache/lit-molecule-developer-tools
    developer_tools_release_binaries: []
  pre_tasks:
    - name: Ensure python3 is present
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          apt-get update && apt-get -y install python3
        fi
      changed_when: false

  tasks:
    - name: Execute lit.ubuntu.developer_tools with non-mutating inputs
      ansible.builtin.import_role:
        name: lit.ubuntu.developer_tools
      when: developer_tools_molecule_execute_role | bool

    - name: Record lit.ubuntu.developer_tools Molecule execution marker
      ansible.builtin.copy:
        dest: /tmp/lit-developer-tools-molecule-execution
        content: "role_executed\n"
        mode: "0644"
