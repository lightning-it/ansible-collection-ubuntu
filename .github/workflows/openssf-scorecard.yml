# yamllint disable rule:truthy
---
name: OpenSSF Scorecard

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:
  branch_protection_rule:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    name: OpenSSF Scorecard
    uses: lightning-it/.github/.github/workflows/openssf-scorecard-reusable.yml@main
    with:
      publish_results: true
